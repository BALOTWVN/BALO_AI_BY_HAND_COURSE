<title>AI Bằng Tay</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Patrick+Hand&family=JetBrains+Mono:wght@400;600&display=swap&subset=vietnamese">
<style>
/* Bố cục: vở ô ly — thanh mục lục bên trái như gáy vở, nội dung trên giấy kẻ ô, mực bút bi xanh + bút đỏ chấm bài */
:root {
  --paper: #F7F9FD;
  --sheet: #FFFFFF;
  --ink: #18213D;
  --muted: #5A6485;
  --line: #D9DFEE;
  --grid: rgba(60, 86, 200, 0.075);
  --pen: #2445C8;
  --pen-soft: #E6EBFB;
  --red: #CF3626;
  --red-soft: #FBE7E4;
  --leaf: #17865A;
  --f-hand: 'Patrick Hand', 'Comic Sans MS', cursive;
  --f-body: 'Be Vietnam Pro', 'Segoe UI', system-ui, sans-serif;
  --f-mono: 'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  --side-w: 300px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0F1320; --sheet: #161B2B; --ink: #E3E7F4; --muted: #96A0BE; --line: #283049;
    --grid: rgba(130, 155, 255, 0.07); --pen: #86A0FF; --pen-soft: #1E2745; --red: #FF7B6A; --red-soft: #3A1E1D; --leaf: #4CC992;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0F1320; --sheet: #161B2B; --ink: #E3E7F4; --muted: #96A0BE; --line: #283049;
  --grid: rgba(130, 155, 255, 0.07); --pen: #86A0FF; --pen-soft: #1E2745; --red: #FF7B6A; --red-soft: #3A1E1D; --leaf: #4CC992;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
body { background: var(--paper); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.65; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--sheet); }
a { color: var(--pen); }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--pen); outline-offset: 2px; }

/* ---------- header ---------- */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--sheet); border-bottom: 1px solid var(--line);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.top-in { display: flex; align-items: center; gap: 14px; height: 58px; }
.brand { display: flex; align-items: baseline; gap: 10px; text-decoration: none; color: var(--ink); }
.brand b { font-family: var(--f-hand); font-size: 30px; font-weight: 400; line-height: 1; color: var(--pen); position: relative; }
.brand b::after { content: ""; position: absolute; left: 0; right: -4px; bottom: -3px; height: 3px; border-radius: 3px; background: var(--red); transform: rotate(-1.2deg); }
.brand span { font-size: 12.5px; color: var(--muted); letter-spacing: .04em; }
.top nav { margin-left: auto; display: flex; gap: 4px; align-items: center; }
.top nav a, .icon-btn { padding: 7px 12px; border-radius: 8px; text-decoration: none; color: var(--ink); font-size: 14.5px; font-weight: 500; border: 0; background: none; cursor: pointer; }
.top nav a:hover, .icon-btn:hover { background: var(--pen-soft); }
.top nav a.on { color: var(--pen); background: var(--pen-soft); }
.menu-btn { display: none; }
.prog-mini { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }

/* ---------- layout ---------- */
.wrap { display: grid; grid-template-columns: var(--side-w) minmax(0, 1fr); min-height: calc(100vh - 58px); }
aside.side { border-right: 1px solid var(--line); background: var(--sheet); position: sticky; top: calc(58px + env(safe-area-inset-top, 0px)); height: calc(100vh - 58px - env(safe-area-inset-top, 0px)); overflow-y: auto;
  padding-block: 16px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: 14px; }
.search { width: 100%; padding: 9px 12px; border: 1px solid var(--line); border-radius: 9px; background: var(--paper); font-size: 14px; }
.ph-group { margin-top: 18px; }
.ph-head { display: flex; gap: 10px; align-items: center; font-weight: 600; font-size: 13.5px; color: var(--ink); margin-bottom: 4px; }
.ph-num { width: 26px; height: 26px; flex: none; border-radius: 50%; border: 1.5px solid var(--pen); color: var(--pen); display: grid; place-items: center; font-family: var(--f-hand); font-size: 17px; }
.ph-head small { margin-left: auto; color: var(--muted); font-weight: 400; font-variant-numeric: tabular-nums; }
.side ul { list-style: none; margin: 0; padding: 0 0 0 13px; border-left: 1.5px dashed var(--line); margin-left: 12px; }
.side li a { display: flex; gap: 8px; align-items: baseline; padding: 5px 8px; border-radius: 7px; text-decoration: none; color: var(--ink); font-size: 14px; line-height: 1.4; }
.side li a:hover { background: var(--pen-soft); }
.side li a.on { background: var(--pen); color: var(--sheet); }
.side li a .code { font-family: var(--f-mono); font-size: 11.5px; color: var(--muted); flex: none; width: 2.3em; }
.side li a.on .code { color: inherit; opacity: .8; }
.side li a .tick { margin-left: auto; color: var(--leaf); font-weight: 700; flex: none; }
.side li a.on .tick { color: inherit; }

main { min-width: 0; padding-block: 28px 80px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px); background-size: 24px 24px; }
.page { max-width: 860px; margin: 0 auto; }

/* ---------- typography ---------- */
h1, h2, h3 { text-wrap: balance; line-height: 1.25; }
h1 { font-size: clamp(28px, 4vw, 40px); margin: 6px 0 10px; letter-spacing: -.01em; }
h2 { font-size: 24px; margin: 44px 0 14px; }
h3 { font-size: 18px; margin: 28px 0 10px; }
.eyebrow { font-size: 12.5px; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.lead { font-size: 18px; color: var(--muted); max-width: 62ch; }
.hand { font-family: var(--f-hand); }
.prose { max-width: 70ch; }
.prose h4 { font-size: 17px; margin: 26px 0 8px; color: var(--pen); }
.prose p, .prose li { max-width: 70ch; }
.prose ul, .prose ol { padding-left: 1.3em; }
.prose li { margin: 4px 0; }
.tip { background: var(--sheet); border: 1px solid var(--line); border-left: 4px solid var(--red); border-radius: 4px 10px 10px 4px; padding: 12px 16px; margin: 18px 0; }
.tbl-wrap, .scroll-x { overflow-x: auto; max-width: 100%; }
table.tbl { border-collapse: collapse; margin: 12px 0; font-size: 14.5px; background: var(--sheet); }
table.tbl th, table.tbl td { border: 1px solid var(--line); padding: 7px 11px; text-align: left; vertical-align: top; }
table.tbl th { background: var(--pen-soft); font-weight: 600; }
mjx-container[display="true"] { overflow-x: auto; overflow-y: hidden; max-width: 100%; padding: 4px 0; }
mjx-container { color: var(--ink); }

/* ---------- lesson ---------- */
.meta { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 4px; }
.chip { display: inline-flex; gap: 6px; align-items: center; padding: 4px 11px; border-radius: 999px; background: var(--sheet); border: 1px solid var(--line); font-size: 13px; color: var(--muted); text-decoration: none; }
a.chip:hover { border-color: var(--pen); color: var(--pen); }
.goals { background: var(--sheet); border: 1px solid var(--line); border-radius: 12px; padding: 14px 18px 14px; margin: 20px 0 8px; }
.goals .eyebrow { color: var(--pen); }
.goals ul { margin: 6px 0 0; padding-left: 1.2em; }
.section-label { display: flex; align-items: center; gap: 10px; margin: 40px 0 12px; }
.section-label .hand { font-size: 26px; color: var(--pen); line-height: 1; }
.section-label::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.app-note { border: 1.5px dashed var(--leaf); border-radius: 12px; padding: 12px 16px; background: var(--sheet); margin-top: 18px; }
.app-note b { color: var(--leaf); }
details.ex { background: var(--sheet); border: 1px solid var(--line); border-radius: 10px; margin: 10px 0; }
details.ex summary { cursor: pointer; padding: 11px 14px; list-style: none; display: flex; gap: 10px; }
details.ex summary::-webkit-details-marker { display: none; }
details.ex summary .q { font-family: var(--f-hand); font-size: 20px; color: var(--red); line-height: 1.2; flex: none; }
details.ex .a { padding: 0 14px 12px 40px; border-top: 1px dashed var(--line); padding-top: 10px; }
details.ex summary .hint { margin-left: auto; font-size: 12.5px; color: var(--muted); flex: none; align-self: center; }
details.ex[open] summary .hint { visibility: hidden; }
.papers { font-size: 14.5px; color: var(--muted); padding-left: 1.2em; }
.pager { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 46px; }
.pager a { display: block; padding: 14px 16px; border: 1px solid var(--line); border-radius: 12px; background: var(--sheet); text-decoration: none; color: var(--ink); min-width: 0; }
.pager a:hover { border-color: var(--pen); }
.pager a small { display: block; color: var(--muted); font-size: 12.5px; }
.pager a.next { text-align: right; }
.done-row { display: flex; align-items: center; gap: 12px; margin-top: 30px; flex-wrap: wrap; }
.btn { display: inline-flex; align-items: center; gap: 8px; padding: 9px 16px; border-radius: 9px; border: 1.5px solid var(--pen); background: var(--sheet); color: var(--pen); font-weight: 600; font-size: 14.5px; cursor: pointer; }
.btn:hover { background: var(--pen-soft); }
.btn.solid { background: var(--pen); color: var(--sheet); }
.btn.small { padding: 5px 11px; font-size: 13.5px; border-width: 1px; }
.btn.ghost { border-color: var(--line); color: var(--ink); }

/* ---------- worksheet (widget) ---------- */
.sheet-box { background: var(--sheet); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.sheet-box .sheet-head { display: flex; gap: 10px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--pen-soft); flex-wrap: wrap; }
.sheet-box .sheet-head .hand { font-size: 22px; color: var(--pen); line-height: 1; }
.sheet-box .sheet-head small { color: var(--muted); }
.sheet { padding: 16px; background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px); background-size: 16px 16px; min-width: 0; }
.ctl { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; margin-bottom: 14px; font-size: 14px; }
.ctl label { display: inline-flex; gap: 8px; align-items: center; }
.ctl input[type=range] { width: 130px; accent-color: var(--pen); }
.ctl output, .val { font-family: var(--f-mono); font-size: 13px; min-width: 3.4em; display: inline-block; font-variant-numeric: tabular-nums; }
.ctl select, .ctl input[type=number] { padding: 4px 8px; border: 1px solid var(--line); border-radius: 7px; background: var(--sheet); }
input.num { width: 3.6em; padding: 3px 4px; text-align: center; border: 1px solid var(--line); border-radius: 6px; background: var(--sheet); font-family: var(--f-hand); font-size: 18px; }
.mats { display: flex; flex-wrap: wrap; gap: 18px 22px; align-items: flex-start; }
.mat { display: inline-flex; flex-direction: column; gap: 4px; }
.mat .lbl { font-size: 13px; color: var(--muted); font-weight: 600; }
.mat .lbl i { font-weight: 400; }
table.m { border-collapse: separate; border-spacing: 3px; }
table.m td { min-width: 2.7em; height: 2.15em; padding: 2px 6px; text-align: center; font-family: var(--f-hand); font-size: 19px; border-radius: 6px; border: 1px solid var(--line); background: var(--sheet); line-height: 1.1; white-space: nowrap; }
table.m td.hl { border-color: var(--pen); box-shadow: inset 0 0 0 1.5px var(--pen); }
table.m td.hl2 { border-color: var(--red); box-shadow: inset 0 0 0 1.5px var(--red); }
table.m td.click { cursor: pointer; }
table.m td.click:hover { border-color: var(--pen); }
table.m td.dim { opacity: .35; }
.calc { margin-top: 14px; padding: 10px 14px; background: var(--paper); border: 1px dashed var(--line); border-radius: 10px; font-size: 15px; overflow-x: auto; }
.calc .hand { font-size: 20px; }
.calc .r { color: var(--red); font-family: var(--f-hand); font-size: 22px; }
.res-line { display: flex; flex-wrap: wrap; gap: 8px 20px; margin-top: 12px; font-size: 14.5px; }
.res-line b { font-family: var(--f-hand); font-size: 21px; color: var(--red); font-weight: 400; }
.note-s { font-size: 13.5px; color: var(--muted); margin-top: 10px; }
canvas.plot { width: 100%; max-width: 640px; height: auto; display: block; background: var(--sheet); border: 1px solid var(--line); border-radius: 10px; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 13px; color: var(--muted); margin-top: 8px; }
.legend i { display: inline-block; width: 18px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 6px; }
.bars { display: grid; grid-template-columns: auto 1fr auto; gap: 5px 10px; align-items: center; font-size: 14px; }
.bar { height: 14px; border-radius: 4px; background: var(--pen); min-width: 1px; transition: width .15s; }
.bar.red { background: var(--red); }
.bar.off { background: var(--line); }
table.steps { border-collapse: collapse; font-size: 14.5px; }
table.steps td, table.steps th { padding: 6px 10px; border-bottom: 1px dashed var(--line); text-align: left; }
table.steps th { font-weight: 600; color: var(--muted); font-size: 13px; }
table.steps td.v { font-family: var(--f-hand); font-size: 20px; color: var(--red); white-space: nowrap; }

/* ---------- diagram ---------- */
.diag { margin: 22px 0; overflow-x: auto; background: var(--sheet); border: 1px solid var(--line); border-radius: 12px; padding: 8px; }
.diag svg { display: block; margin: 0 auto; }

/* ---------- home ---------- */
.hero { padding: 18px 0 8px; }
.hero h1 { font-size: clamp(34px, 6vw, 56px); margin: 0; letter-spacing: -.02em; }
.hero h1 .hand { color: var(--pen); font-weight: 400; font-size: 1.12em; }
.hero h1 .strike { position: relative; white-space: nowrap; }
.hero .lead { margin-top: 14px; }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0; margin: 28px 0 8px; border: 1px solid var(--line); border-radius: 12px; background: var(--sheet); overflow: hidden; }
.stats div { padding: 14px 16px; border-right: 1px solid var(--line); }
.stats div:last-child { border-right: 0; }
.stats b { display: block; font-family: var(--f-hand); font-size: 36px; color: var(--pen); font-weight: 400; line-height: 1.05; }
.stats span { font-size: 13px; color: var(--muted); }
.road { position: relative; margin-top: 18px; }
.road-item { display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 0 14px; position: relative; padding-bottom: 22px; }
.road-item::before { content: ""; position: absolute; left: 27px; top: 50px; bottom: 0; border-left: 2px dashed var(--line); }
.road-item:last-child::before { display: none; }
.road-num { width: 54px; height: 54px; border-radius: 50%; border: 2px solid var(--pen); display: grid; place-items: center; font-family: var(--f-hand); font-size: 30px; color: var(--pen); background: var(--sheet); }
.road-card { background: var(--sheet); border: 1px solid var(--line); border-radius: 12px; padding: 14px 18px; min-width: 0; }
.road-card h3 { margin: 0; font-size: 19px; }
.road-card h3 small { font-weight: 400; color: var(--muted); font-size: 14px; margin-left: 6px; }
.road-card .wk { float: right; font-size: 13px; color: var(--red); font-weight: 600; }
.road-card p { margin: 6px 0; }
.road-card .out { font-size: 14px; color: var(--muted); }
.road-card .out b { color: var(--leaf); }
.lchips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.lchips a { font-size: 13px; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line); text-decoration: none; color: var(--ink); background: var(--paper); }
.lchips a:hover { border-color: var(--pen); color: var(--pen); }
.lchips a.done { border-color: var(--leaf); color: var(--leaf); }
.method { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.method div { background: var(--sheet); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
.method .hand { font-size: 24px; color: var(--red); line-height: 1; }
.method h3 { margin: 6px 0 4px; font-size: 16.5px; }
.method p { margin: 0; font-size: 14.5px; color: var(--muted); }
.weeks td:first-child { font-family: var(--f-hand); font-size: 19px; color: var(--pen); white-space: nowrap; }
.weeks td a { text-decoration: none; }
.weeks td a:hover { text-decoration: underline; }
.res-list li { margin: 6px 0; }
.foot { margin-top: 50px; font-size: 13px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 14px; }


/* ---------- lesson extras ---------- */
.intuit { margin: 22px 0 6px; padding: 16px 20px; background: var(--sheet); border: 1.5px solid var(--pen); border-radius: 14px; position: relative; }
.intuit .eyebrow { color: var(--pen); margin-bottom: 4px; }
.intuit p { margin: 8px 0; max-width: 70ch; }
.worked { background: var(--sheet); border: 1px solid var(--line); border-radius: 14px; padding: 16px 20px; }
.worked h3 { margin: 0 0 6px; font-size: 18px; }
.worked .setup { margin: 0 0 12px; padding: 10px 14px; background: var(--paper); border-radius: 10px; }
ol.wsteps { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
ol.wsteps li { display: grid; grid-template-columns: 74px minmax(0, 1fr); gap: 10px; align-items: baseline; padding: 10px 12px; border-left: 3px solid var(--pen); background: var(--paper); border-radius: 0 10px 10px 0; }
ol.wsteps li .sn { font-family: var(--f-hand); font-size: 19px; color: var(--pen); white-space: nowrap; }
ol.wsteps li > div { min-width: 0; overflow-x: auto; }
.ans { margin-top: 12px; padding: 10px 14px; border: 1.5px dashed var(--red); border-radius: 10px; background: var(--red-soft); }
.ans .hand { color: var(--red); font-size: 21px; margin-right: 6px; }
.step-ctl { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 12px; }
details.ex .a .wsteps li { background: var(--sheet); }
.miss { display: grid; gap: 10px; }
.miss > div { background: var(--sheet); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; }
.miss p { margin: 4px 0; display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 6px; }
.miss p span { font-weight: 700; }
.miss .wrong { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--red); text-decoration-thickness: 1.5px; }
.miss .wrong span { color: var(--red); text-decoration: none; }
.miss .right span { color: var(--leaf); }
.recap { margin-top: 26px; padding: 14px 18px; border: 2px solid var(--ink); border-radius: 14px; background: var(--sheet); }
.recap ul { margin: 6px 0 0; padding-left: 1.2em; }
.recap li { margin: 4px 0; }
.map-teaser { display: grid; gap: 4px; margin: 26px 0 0; padding: 14px 18px; border-radius: 12px; border: 1.5px solid var(--red); background: var(--sheet); text-decoration: none; color: var(--ink); }
.map-teaser .hand { font-size: 26px; color: var(--red); line-height: 1.1; }
.map-teaser:hover { background: var(--red-soft); }
.fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.field { background: var(--sheet); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; min-width: 0; display: flex; flex-direction: column; }
.field-h { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; margin-bottom: 6px; }
.field-h b { font-size: 17px; }
.field-h span { font-size: 12.5px; color: var(--muted); letter-spacing: .03em; }
.field dl { margin: 0 0 8px; font-size: 14.5px; }
.field dt { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--pen); font-weight: 600; margin-top: 8px; }
.field dd { margin: 2px 0 0; }
.field .lchips { margin-top: auto; padding-top: 6px; }
.tl { display: grid; gap: 0; border-left: 2px dashed var(--line); margin-left: 8px; }
.tl-i { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 12px; padding: 6px 0 6px 16px; position: relative; }
.tl-i::before { content: ""; position: absolute; left: -6px; top: 15px; width: 10px; height: 10px; border-radius: 50%; background: var(--pen); }
.tl-i .hand { font-size: 21px; color: var(--pen); }
.tl-i p { margin: 2px 0; }
@media (max-width: 720px) { .fields { grid-template-columns: minmax(0, 1fr); } ol.wsteps li { grid-template-columns: minmax(0, 1fr); gap: 2px; } .tl-i { grid-template-columns: 70px minmax(0, 1fr); } }


/* ---------- stepper ---------- */
[hidden] { display: none !important; }
.sw { background: var(--sheet); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; outline: none; }
.sw:focus-visible { box-shadow: 0 0 0 2px var(--pen); }
.sw-top { padding: 10px 16px; background: var(--pen-soft); border-bottom: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; }
.sw-top span { font-size: 13.5px; color: var(--muted); }
.sw-ctl { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 10px 16px; border-bottom: 1px dashed var(--line); position: sticky; top: calc(58px + env(safe-area-inset-top, 0px)); background: var(--sheet); z-index: 2; }

.sw-scroll { overflow-x: auto; padding: 14px 16px; background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px); background-size: 16px 16px; }

.sw-l { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; text-align: right; max-width: 380px; }

.sw-mat td { min-width: 2.7em; height: 2em; padding: 1px 5px; text-align: center; font-family: var(--f-hand); font-size: 18px; line-height: 1.1; border: 1px solid var(--line); border-radius: 5px; background: var(--sheet); white-space: nowrap; transition: background .15s, border-color .15s; }

@media (max-width: 620px) { .sw-grid { grid-template-columns: auto; } .sw-l { align-items: flex-start; text-align: left; } .sw-ops { justify-content: flex-start; } }

/* ---------- video ---------- */

.vp-scene a { color: inherit; }
.vp-scene .note-s, .vp-scene .eyebrow { color: rgba(255,255,255,.62); }
.vs-title { text-align: center; }
.vs-title h2 { font-size: clamp(24px, 4vw, 40px); margin: 6px 0; color: #fff; }

.vs-calc .sw-scroll { padding: 8px; }
.vs-calc .sw-mat td { font-size: 16px; min-width: 2.4em; height: 1.8em; }
.vs-calc .sw-bar { position: absolute; left: 0; right: 0; bottom: 0; min-height: 0; padding: 0; height: 0; overflow: hidden; }
.vp-cap { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); width: min(92%, 760px); background: rgba(0,0,0,.72); color: #fff; padding: 8px 14px; border-radius: 8px; font-size: clamp(14px, 1.8vw, 17px); line-height: 1.45; text-align: center; }
.vp-cap:empty { display: none; }
.vp-big { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; background: rgba(15,19,32,.62); color: #fff; border: 0; cursor: pointer; font: inherit; font-size: 20px; font-weight: 600; }
.vp-big span { font-size: 54px; line-height: 1; }
.vp-big small { font-size: 13px; font-weight: 400; opacity: .8; }
.vp-ctl { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; padding: 10px 14px; border-top: 1px solid var(--line); font-size: 13.5px; }
.vp-ctl label { display: inline-flex; gap: 6px; align-items: center; }
.vp-dots { display: flex; gap: 5px; flex: 1; min-width: 120px; }
.vp-dots button { flex: 1; height: 8px; border-radius: 4px; border: 0; background: var(--line); cursor: pointer; padding: 0; }
.vp-dots button.done { background: var(--pen); opacity: .45; }
.vp-dots button.on { background: var(--red); }
.vp-note { padding: 0 14px 10px; }
.vp-note:empty { display: none; }

/* ---------- paper card ---------- */
.paper-card { background: var(--sheet); border: 1px solid var(--line); border-left: 4px solid var(--pen); border-radius: 4px 12px 12px 4px; padding: 14px 18px; }

.paper-card dd { margin: 3px 0 0; }
.paper-card dd ol { margin: 0; padding-left: 1.2em; }
.papers a { color: inherit; }


/* ---------- chống tràn ngang trên điện thoại ---------- */
details.ex { overflow-x: auto; }
.worked, .prose, details.ex, .ex .a, .miss, .recap, .intuit { min-width: 0; max-width: 100%; overflow-wrap: anywhere; }
.worked table, .prose table, .ex .a table { display: block; overflow-x: auto; max-width: 100%; }
mjx-container[display="true"] { display: block; max-width: 100%; overflow-x: auto; overflow-y: hidden; }
.worked pre, .prose pre { overflow-x: auto; max-width: 100%; }
/* ---------- flow diagrams ---------- */
#page, #flw, .kit-flow { min-width: 0; max-width: 100%; }
.fl-wrap { max-width: 100%; min-width: 0; background: var(--sheet); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.fl-scroll { overflow-x: auto; padding: 10px 8px 4px; background-image: radial-gradient(var(--grid) 1.2px, transparent 1.2px); background-size: 14px 14px; }
.fl-svg { display: block; width: 100%; min-width: 560px; height: auto; }
.fl-svg.net { min-width: 360px; max-width: 760px; margin: 0 auto; }
.fl-n rect { fill: var(--pen-soft); stroke: var(--line); stroke-width: 1.5; transition: fill .35s, stroke .35s, filter .35s; }
.fl-n.past rect { stroke: var(--pen); }
.fl-n.on rect { fill: var(--red-soft); stroke: var(--red); stroke-width: 2.5; filter: drop-shadow(0 3px 8px rgba(207,54,38,.35)); }
.fl-n.on { animation: flPop .5s ease; }
@keyframes flPop { 0% { transform: translateY(3px); } 60% { transform: translateY(-2px); } 100% { transform: none; } }
.fl-e { opacity: .45; transition: opacity .3s, stroke-width .3s; }
.fl-e.on { opacity: 1; stroke-width: 2.6; stroke-dasharray: 7 5; animation: flDash 0.8s linear infinite; }
.fl-e.back.on { animation-direction: normal; }
@keyframes flDash { to { stroke-dashoffset: -24; } }
.fl-dot { opacity: 0; transition: opacity .3s; }
.fl-dot.on { opacity: 1; }
.fl-slide { animation: flSlide 2.4s steps(1) infinite; }
@keyframes flSlide { 0% { transform: translate(0, 0); } 25% { transform: translate(15px, 0); } 50% { transform: translate(15px, 15px); } 75% { transform: translate(0, 15px); } }
.fl-pulse { animation: flPulse 1.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes flPulse { 50% { transform: scale(1.5); opacity: .5; } }
.fl-bar { animation: flBar 1.8s ease-in-out infinite; transform-box: fill-box; transform-origin: bottom; }
.fl-bar1 { animation-delay: .3s; } .fl-bar2 { animation-delay: .6s; }
@keyframes flBar { 50% { transform: scaleY(.45); } }
.fl-tw { animation: flTw 1.2s ease-in-out infinite alternate; }
@keyframes flTw { to { opacity: .15; } }
.fl-spin { animation: flSpin 4s linear infinite; }
@keyframes flSpin { to { transform: rotate(360deg); } }
.fl-look { animation: flLook 2.2s ease-in-out infinite; }
@keyframes flLook { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
.fl-roll { animation: flRoll 2.4s ease-in-out infinite; }
@keyframes flRoll { 0% { transform: translate(0, 0); } 50% { transform: translate(12px, 14px); } 100% { transform: translate(22px, 12px); } }
.fl-flow { animation: flDash 0.9s linear infinite; }
.fl-cap { display: flex; gap: 10px; align-items: baseline; padding: 8px 14px; border-top: 1px dashed var(--line); min-height: 44px; }
.fl-num { color: var(--red); font-size: 20px; flex: none; }
.fl-txt { font-size: 15px; }
.fl-ctl { display: flex; gap: 6px; align-items: center; padding: 0 14px 10px; }
.fl-dots { display: flex; gap: 4px; margin-left: 8px; }
.fl-dots span { width: 18px; height: 5px; border-radius: 3px; background: var(--line); }
.fl-dots span.on { background: var(--red); }
.nt-w { stroke: var(--line); transition: stroke .3s, opacity .3s; }
.nt-w.on { stroke: var(--pen); stroke-dasharray: 6 5; animation: flDash .7s linear infinite; }
.nt-w.on.back { stroke: var(--red); animation-direction: reverse; }
.nt-n { fill: var(--sheet); stroke: var(--pen); stroke-width: 2; transition: fill .3s; }
.nt-n.fwd { fill: var(--pen-soft); }
.nt-n.on { fill: var(--pen); }
.nt-n.on + text { fill: var(--sheet); }
.nt-n.bwd { fill: var(--red-soft); stroke: var(--red); }
.nt-n.grad { fill: var(--red); stroke: var(--red); }
.nt-n.grad + text { fill: var(--sheet); }
@media (prefers-reduced-motion: reduce) { .fl-e.on, .nt-w.on, .fl-slide, .fl-pulse, .fl-bar, .fl-tw, .fl-spin, .fl-look, .fl-roll, .fl-flow, .fl-n.on { animation: none; } }

/* ---------- illustrations ---------- */
.ill-box { background: var(--sheet); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.ill-title { padding: 10px 16px; background: var(--pen-soft); border-bottom: 1px solid var(--line); }

/* ---------- video (redesign) ---------- */
.vp-stage { background: #0E1430; }

.vs-code { font-size: clamp(30px, 5vw, 52px); background: linear-gradient(90deg, #A9BAFF, #FF9D8C); -webkit-background-clip: text; background-clip: text; color: transparent; margin: 10px 0 4px; }

.vs-en { color: #B9C3E6; font-size: 15px; margin: 6px 0 12px; }
.vs-card { background: var(--sheet); color: var(--ink); border-radius: 14px; padding: 16px 20px; box-shadow: 0 12px 40px rgba(0,0,0,.35); max-width: 820px; margin: 0 auto; }

/* ---------- chức năng / sức mạnh / nhược điểm ---------- */
