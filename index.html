L({ id: 'aitypes', p: 'p0', t: 'Các thể loại AI: bốn cách phân loại', en: 'Types of AI', min: 60, pre: [],
  goals: ['Phân loại một hệ AI theo năng lực, chức năng, phương pháp và đầu ra', 'Biết 5 trường phái học máy và đại diện của mỗi trường phái', 'Nhìn AI như một “tác tử” hành động trong môi trường'],
  intuit: R`<p>Hỏi “AI là loại gì” giống hỏi “xe là loại gì”: có thể chia theo <b>công suất</b> (xe máy, ô tô, xe tải), theo <b>nhiên liệu</b> (xăng, điện, hybrid), theo <b>công dụng</b> (chở người, chở hàng). Các cách chia không loại trừ nhau. Một chiếc VinFast VF3 vừa là ô tô nhỏ, vừa chạy điện, vừa chở người.</p>
<p>AI cũng vậy. ChatGPT là <b>AI hẹp</b> (theo năng lực), thuộc trường phái <b>kết nối</b> (theo phương pháp), là mô hình <b>sinh</b> (theo đầu ra), học bằng <b>tự giám sát + tăng cường</b> (theo cách học). Biết nhiều “trục” giúp bạn đặt bất kỳ hệ thống nào lên bản đồ.</p>`,
  body: R`
<h4>Trục 1: theo năng lực</h4>
<table class="tbl"><tr><th>Loại</th><th>Ý nghĩa</th><th>Hiện trạng</th></tr>
<tr><td>AI hẹp (ANI)</td><td>Giỏi một nhóm việc cụ thể</td><td>Mọi AI hiện có, kể cả LLM mạnh nhất</td></tr>
<tr><td>AI tổng quát (AGI)</td><td>Làm được hầu hết việc trí óc con người làm, học việc mới linh hoạt</td><td>Chưa đạt; định nghĩa và mốc thời gian còn tranh luận</td></tr>
<tr><td>Siêu trí tuệ (ASI)</td><td>Vượt xa con người ở hầu hết lĩnh vực</td><td>Giả thuyết</td></tr></table>
<h4>Trục 2: theo chức năng (cách chia phổ biến trên báo chí)</h4>
<ul><li><b>Máy phản xạ:</b> phản ứng với đầu vào hiện tại, không nhớ quá khứ (Deep Blue chơi cờ).</li>
<li><b>Bộ nhớ hạn chế:</b> dùng dữ liệu quá khứ để quyết định; gần như mọi hệ học máy hiện nay.</li>
<li><b>“Theory of mind”</b> và <b>tự nhận thức:</b> các mức giả định, chưa tồn tại. Cách chia này ít dùng trong nghiên cứu.</li></ul>
<h4>Trục 3: theo phương pháp, “5 trường phái” (Pedro Domingos)</h4>
<table class="tbl"><tr><th>Trường phái</th><th>Gốc</th><th>Ý tưởng</th><th>Đại diện</th><th>Trong khóa</th></tr>
<tr><td>Biểu tượng</td><td>Logic</td><td>Tri thức = luật và ký hiệu</td><td>Cây quyết định, hệ chuyên gia, logic</td><td>Giai đoạn 1, 8</td></tr>
<tr><td>Kết nối</td><td>Thần kinh học</td><td>Học trọng số của mạng nơ-ron</td><td>MLP, CNN, Transformer</td><td>Giai đoạn 2–7</td></tr>
<tr><td>Bayes</td><td>Thống kê</td><td>Mọi thứ là xác suất, cập nhật niềm tin</td><td>Naive Bayes, mạng Bayes, HMM</td><td>Giai đoạn 1, 8</td></tr>
<tr><td>Tiến hóa</td><td>Sinh học</td><td>Chọn lọc và lai ghép lời giải</td><td>Giải thuật di truyền</td><td>Giai đoạn 8</td></tr>
<tr><td>Loại suy</td><td>Tâm lý học</td><td>Giống cái đã biết thì xử lý giống vậy</td><td>k-NN, SVM</td><td>Giai đoạn 1</td></tr></table>
<p>Ngoài 5 trường phái còn có <b>AI biểu tượng cổ điển</b> không học từ dữ liệu: tìm kiếm (A*), chơi cờ (minimax), lập kế hoạch. Xu hướng hiện nay là <b>lai</b>: LLM (kết nối) + công cụ tìm kiếm và logic (biểu tượng) + RL.</p>
<h4>Trục 4: theo đầu ra</h4>
<p><b>Phân biệt</b> (discriminative) học $p(y\mid x)$: cho ảnh, đoán nhãn. <b>Sinh</b> (generative) học $p(x)$ hoặc $p(x\mid y)$: tạo ra dữ liệu mới. Phân loại lỗi là phân biệt; sinh ảnh lỗi tổng hợp là sinh.</p>
<h4>Góc nhìn tác tử</h4>
<p>Giáo trình AI kinh điển của Russell & Norvig định nghĩa AI là xây dựng <b>tác tử hợp lý</b>: nhận thức môi trường qua cảm biến, hành động qua cơ cấu chấp hành, chọn hành động tối đa hóa kết quả kỳ vọng. Môi trường được mô tả qua các cặp: quan sát được đầy đủ hay một phần, tất định hay ngẫu nhiên, tĩnh hay động, rời rạc hay liên tục, một hay nhiều tác tử. Cờ vua: đầy đủ, tất định, rời rạc. Lái xe: một phần, ngẫu nhiên, liên tục, nhiều tác tử, khó hơn nhiều.</p>`,
  w: 'aiclass',
  worked: { t: 'Đặt ba hệ thống lên bản đồ',
    setup: R`Phân loại theo 4 trục: (a) máy AOI dùng luật “độ rộng mạch &lt; 80 µm thì báo lỗi”; (b) mô hình PatchCore phát hiện bất thường; (c) Stable Diffusion sinh ảnh lỗi tổng hợp.`,
    steps: [
      R`<b>(a) Năng lực:</b> AI hẹp (thậm chí chỉ là luật). <b>Chức năng:</b> phản xạ (không nhớ, không học). <b>Phương pháp:</b> biểu tượng, luật do kỹ sư viết. <b>Đầu ra:</b> phân biệt (OK/NG).`,
      R`<b>(b) Năng lực:</b> AI hẹp. <b>Chức năng:</b> bộ nhớ hạn chế (lưu ngân hàng đặc trưng ảnh tốt). <b>Phương pháp:</b> lai: đặc trưng từ CNN (kết nối) + so láng giềng gần nhất (loại suy). <b>Đầu ra:</b> phân biệt (điểm bất thường).`,
      R`<b>(c) Năng lực:</b> AI hẹp. <b>Chức năng:</b> bộ nhớ hạn chế. <b>Phương pháp:</b> kết nối (U-Net/Transformer + diffusion). <b>Đầu ra:</b> sinh.`,
      R`<b>Nhận xét:</b> cả ba đều là AI hẹp; khác biệt thực sự nằm ở trục phương pháp và đầu ra. Đó là hai trục hữu ích nhất khi đọc paper.`,
    ],
    ans: R`(a) biểu tượng, phân biệt; (b) lai kết nối + loại suy, phân biệt; (c) kết nối, sinh. Cả ba là AI hẹp.` },
  ex: [
    { q: R`Google Maps tìm đường ngắn nhất từ Biên Hòa đến Vũng Tàu thuộc trường phái nào? Có “học” không?`, s: [R`Lõi là bài toán tìm đường trên đồ thị đường bộ.`, R`Thuật toán A*/Dijkstra là tìm kiếm biểu tượng, không học từ dữ liệu.`, R`Phần dự đoán tắc đường dùng học máy trên dữ liệu lịch sử.`], a: R`Lai: tìm kiếm biểu tượng (A*) + học máy dự đoán thời gian di chuyển.` },
    { q: R`Mô tả môi trường của robot gắp linh kiện trên băng chuyền theo các cặp tính chất.`, s: [R`Quan sát: một phần (camera bị che khuất).`, R`Ngẫu nhiên (vị trí linh kiện thay đổi, ma sát).`, R`Động (băng chuyền chạy), liên tục (tọa độ, lực).`, R`Có thể nhiều tác tử nếu có công nhân hoặc robot khác.`], a: R`Một phần, ngẫu nhiên, động, liên tục, có thể nhiều tác tử: một môi trường khó.` },
  ],
  miss: [[R`AI = học sâu.`, R`Học sâu chỉ là một trường phái. Nhiều hệ AI quan trọng dùng tìm kiếm, logic, xác suất hay cây quyết định.`], [R`LLM mạnh nhất hiện nay đã là AGI.`, R`Theo phân loại thông dụng, mọi hệ hiện có vẫn là AI hẹp; việc khi nào đạt AGI còn tranh luận.`]],
  recap: [R`Bốn trục: năng lực, chức năng, phương pháp, đầu ra.`, R`5 trường phái: biểu tượng, kết nối, Bayes, tiến hóa, loại suy.`, R`AI = tác tử hợp lý trong môi trường.`],
  papers: ['Russell & Norvig — Artificial Intelligence: A Modern Approach (4th ed.), chương 1–2', 'Domingos (2015) — The Master Algorithm'] });

L({ id: 'evaluation', p: 'pml', t: 'Đánh giá mô hình: precision, recall, ROC', en: 'Model Evaluation', min: 90, pre: ['mlbasics'],
  goals: ['Lập ma trận nhầm lẫn và tính precision, recall, F1', 'Đọc đường ROC, PR và chọn ngưỡng', 'Dùng kiểm định chéo k-fold đúng cách'],
  intuit: R`<p>Một máy AOI báo “OK” cho <b>mọi</b> bo mạch đạt độ chính xác 98% nếu chỉ 2% bo bị lỗi. Nghe rất tốt, nhưng máy này vô dụng: nó không bắt được lỗi nào. Đó là <b>nghịch lý độ chính xác</b> khi dữ liệu mất cân bằng.</p>
<p>Hãy nghĩ như <b>lưới đánh cá</b>: <b>recall</b> là bắt được bao nhiêu phần trăm số cá trong hồ; <b>precision</b> là trong mẻ lưới có bao nhiêu phần trăm là cá thật (không phải rác). Lưới mắt nhỏ bắt nhiều cá hơn nhưng vớt thêm nhiều rác; mắt to thì sạch hơn nhưng sót cá. <b>Ngưỡng</b> quyết định cỡ mắt lưới.</p>`,
  body: R`
<h4>Ma trận nhầm lẫn</h4>
<table class="tbl"><tr><th></th><th>Dự đoán NG (lỗi)</th><th>Dự đoán OK</th></tr>
<tr><th>Thật NG</th><td>TP (bắt đúng)</td><td>FN (lọt lỗi)</td></tr>
<tr><th>Thật OK</th><td>FP (báo động giả)</td><td>TN (bỏ qua đúng)</td></tr></table>
$$\text{Precision} = \frac{TP}{TP+FP},\quad \text{Recall} = \frac{TP}{TP+FN},\quad F_1 = \frac{2PR}{P+R}$$
$$\text{Accuracy} = \frac{TP+TN}{\text{tổng}},\qquad \text{FPR} = \frac{FP}{FP+TN}$$
<h4>Ngưỡng và đường cong</h4>
<p>Mô hình cho <b>điểm</b> (xác suất lỗi). Chọn ngưỡng $\tau$: điểm $\ge\tau$ thì gọi NG. Quét $\tau$ từ cao xuống thấp:</p>
<ul><li><b>ROC:</b> trục ngang FPR, trục dọc recall (TPR). AUC = diện tích dưới đường = xác suất một mẫu lỗi ngẫu nhiên có điểm cao hơn một mẫu tốt ngẫu nhiên. 0.5 là đoán bừa, 1 là hoàn hảo.</li>
<li><b>PR:</b> trục ngang recall, dọc precision. Nhạy hơn ROC khi lớp dương rất hiếm.</li></ul>
<h4>Kiểm định chéo k-fold</h4>
<p>Chia dữ liệu thành $k$ phần; lần lượt dùng 1 phần làm validation, $k-1$ phần còn lại để train; lấy trung bình $k$ kết quả. Dùng <b>stratified</b> k-fold để mỗi phần có tỷ lệ lỗi giống nhau. Với ảnh từ cùng một tấm panel, phải chia theo <b>nhóm</b> (group k-fold) để ảnh “anh em” không nằm ở cả train và validation (rò rỉ dữ liệu).</p>
<h4>Hồi quy</h4>
<p>MAE (sai số tuyệt đối trung bình, cùng đơn vị dữ liệu), RMSE (phạt sai số lớn), $R^2 = 1 - \frac{\sum(y-\hat y)^2}{\sum(y-\bar y)^2}$ (tỷ lệ phương sai giải thích được).</p>`,
  w: 'roc',
  worked: { t: 'Đánh giá máy AOI trên 1000 bo mạch',
    setup: R`1000 bo, 20 bo lỗi thật. Mô hình gọi NG 50 bo, trong đó 18 bo lỗi thật.`,
    steps: [
      R`<b>Điền ma trận:</b> TP = 18 (bắt đúng). FN = 20 − 18 = 2 (lọt). FP = 50 − 18 = 32 (báo động giả). TN = 1000 − 18 − 2 − 32 = 948.`,
      R`<b>Accuracy</b> $= (18 + 948)/1000 = 96.6\%$. Thấp hơn cả máy “luôn báo OK” (98%)! Nhưng máy này hữu ích hơn nhiều.`,
      R`<b>Recall</b> $= 18/20 = 90\%$: lọt 10% số bo lỗi.`,
      R`<b>Precision</b> $= 18/50 = 36\%$: cứ 100 bo bị gọi NG, 64 bo thật ra tốt (phải kiểm lại bằng mắt).`,
      R`<b>F1</b> $= 2\cdot0.36\cdot0.9/(0.36+0.9) = 0.648/1.26 = 0.514$.`,
      R`<b>FPR</b> $= 32/(32+948) = 3.3\%$.`,
      R`<b>Quyết định:</b> nếu yêu cầu không được lọt lỗi, recall 90% chưa đủ: hạ ngưỡng để tăng recall, chấp nhận FP tăng. Chi phí kiểm lại 1 bo tốt thường rẻ hơn nhiều so với 1 bo lỗi tới tay khách.`,
    ],
    ans: R`Recall 90%, precision 36%, F1 0.514, accuracy 96.6%, FPR 3.3%.` },
  ex: [
    { q: R`Bốn ảnh lỗi có điểm $[0.9, 0.8, 0.4, 0.3]$; bốn ảnh tốt có điểm $[0.7, 0.35, 0.2, 0.1]$. Tính AUC bằng cách đếm cặp.`, s: [R`AUC = tỷ lệ cặp (lỗi, tốt) mà điểm lỗi > điểm tốt. Có $4\times4=16$ cặp.`, R`Lỗi 0.9: thắng cả 4. Lỗi 0.8: thắng cả 4.`, R`Lỗi 0.4: thắng 0.35, 0.2, 0.1 → 3. Lỗi 0.3: thắng 0.2, 0.1 → 2.`, R`Tổng $4+4+3+2 = 13$.`], a: R`AUC $=13/16 = 0.8125$.` },
    { q: R`Với các điểm ở câu trên, ngưỡng 0.5 cho precision và recall bao nhiêu?`, s: [R`Gọi NG các điểm ≥ 0.5: lỗi 0.9, 0.8 và tốt 0.7.`, R`TP = 2, FP = 1, FN = 2.`, R`P = 2/3, R = 2/4.`], a: R`Precision 0.667, recall 0.5.` },
  ],
  miss: [[R`Accuracy cao là mô hình tốt.`, R`Với dữ liệu mất cân bằng, accuracy gần như vô nghĩa. Nhìn recall, precision, PR-AUC.`], [R`Chọn ngưỡng 0.5 là mặc định đúng.`, R`Ngưỡng là quyết định nghiệp vụ, chọn trên tập validation theo chi phí lọt lỗi và chi phí báo động giả.`]],
  recap: [R`Precision = đúng trong số bị gọi; recall = bắt được trong số thật sự.`, R`ROC-AUC: xác suất xếp hạng đúng một cặp lỗi–tốt.`, R`Kiểm định chéo theo nhóm để tránh rò rỉ.`],
  papers: ['Saito & Rehmsmeier (2015) — The Precision-Recall Plot Is More Informative than the ROC Plot on Imbalanced Datasets'] });

/* ===== Giai đoạn: Học máy cổ điển ===== */
L({ id: 'knn', p: 'pml', t: 'k láng giềng gần nhất (k-NN)', en: 'k-Nearest Neighbors', min: 60, pre: ['mlbasics', 'vector'],
  goals: ['Phân loại bằng bỏ phiếu k láng giềng', 'Hiểu vai trò của k và của chuẩn hóa đặc trưng', 'Biết “lời nguyền số chiều”'],
  intuit: R`<p>Bạn chuyển tới khu trọ mới và muốn biết quán cơm nào ngon. Bạn hỏi <b>3 người hàng xóm gần nhất</b>; 2 người khen quán A, 1 người khen quán B, bạn đi quán A. Đó là k-NN với $k=3$. Không có “học” gì cả: chỉ nhớ tất cả dữ liệu, và khi cần thì hỏi những điểm giống mình nhất.</p>`,
  body: R`
<h4>Thuật toán</h4>
<ol><li>Lưu toàn bộ dữ liệu huấn luyện.</li><li>Với điểm mới $\mathbf x$, tính khoảng cách tới mọi điểm (thường là Euclid $\|\mathbf x - \mathbf x_i\|$).</li><li>Lấy $k$ điểm gần nhất, bỏ phiếu theo nhãn (hồi quy thì lấy trung bình).</li></ol>
<h4>Chọn k</h4>
<p>$k$ nhỏ (1): ranh giới gồ ghề, nhạy với nhiễu (quá khớp). $k$ lớn: ranh giới mượt, có thể bỏ qua cấu trúc nhỏ (thiếu khớp). Chọn $k$ bằng kiểm định chéo; với 2 lớp nên chọn $k$ lẻ để tránh hòa.</p>
<h4>Chuẩn hóa là bắt buộc</h4>
<p>Nếu một đặc trưng đo bằng µm (0–200) và một đặc trưng là tỷ lệ (0–1), khoảng cách bị đặc trưng µm chi phối hoàn toàn. Chuẩn hóa từng đặc trưng về trung bình 0, độ lệch 1 trước khi tính.</p>
<h4>Lời nguyền số chiều</h4>
<p>Trong không gian nhiều chiều, mọi điểm đều “xa như nhau”; khoảng cách mất ý nghĩa. k-NN trên pixel thô hoạt động kém, nhưng k-NN trên <b>đặc trưng học sâu</b> (embedding) rất mạnh. PatchCore và RAG thực chất là k-NN trên embedding.</p>`,
  w: 'knn',
  worked: { t: 'Phân loại một bo mạch mới bằng k-NN',
    setup: R`Đặc trưng đã chuẩn hóa (độ rộng mạch, độ sáng). Dữ liệu: A $(1,1)$ OK, B $(2,1)$ OK, C $(1,2)$ OK, D $(4,4)$ NG, E $(5,3)$ NG. Điểm mới $\mathbf x = (3, 3)$. Phân loại với $k=1$ và $k=3$.`,
    steps: [
      R`<b>Khoảng cách tới A:</b> $\sqrt{(3-1)^2+(3-1)^2} = \sqrt8 = 2.83$.`,
      R`<b>Tới B:</b> $\sqrt{1+4} = 2.24$. <b>Tới C:</b> $\sqrt{4+1} = 2.24$.`,
      R`<b>Tới D:</b> $\sqrt{1+1} = 1.41$. <b>Tới E:</b> $\sqrt{4+0} = 2.00$.`,
      R`<b>Sắp xếp:</b> D (1.41, NG), E (2.00, NG), B (2.24, OK), C (2.24, OK), A (2.83, OK).`,
      R`<b>k = 1:</b> láng giềng gần nhất D → NG.`,
      R`<b>k = 3:</b> D, E, và một trong B/C (hòa khoảng cách) → 2 NG, 1 OK → NG.`,
      R`<b>k = 5:</b> 2 NG, 3 OK → OK. Kết quả đổi theo $k$: đây là lý do phải chọn $k$ bằng validation.`,
    ],
    ans: R`$k=1$ và $k=3$: NG; $k=5$: OK.` },
  ex: [
    { q: R`Dữ liệu có đặc trưng 1 trong khoảng 0–1000 và đặc trưng 2 trong 0–1. Điểm mới $(500, 0.1)$, hai điểm $P=(510, 0.9)$ và $Q=(450, 0.1)$. Không chuẩn hóa, điểm nào gần hơn?`, s: [R`Tới P: $\sqrt{10^2 + 0.8^2}\approx10.03$.`, R`Tới Q: $\sqrt{50^2 + 0} = 50$.`, R`P gần hơn dù đặc trưng 2 khác rất nhiều (0.1 so với 0.9).`], a: R`P; đặc trưng 2 gần như bị bỏ qua. Cần chuẩn hóa.` },
  ],
  miss: [[R`k-NN huấn luyện chậm.`, R`Huấn luyện tức thì (chỉ lưu dữ liệu); <b>suy luận</b> mới chậm vì phải so với mọi điểm. Dùng cấu trúc tìm kiếm (KD-tree, FAISS) để tăng tốc.`]],
  recap: [R`Nhớ dữ liệu, hỏi $k$ điểm gần nhất, bỏ phiếu.`, R`Luôn chuẩn hóa đặc trưng.`, R`Mạnh khi dùng trên embedding tốt.`],
  papers: ['Cover & Hart (1967) — Nearest neighbor pattern classification'] });

L({ id: 'svm', p: 'pml', t: 'Máy vectơ hỗ trợ (SVM)', en: 'Support Vector Machines', min: 75, pre: ['knn', 'calculus'],
  goals: ['Hiểu “lề rộng nhất” và vectơ hỗ trợ', 'Tính hinge loss bằng tay', 'Hiểu ý tưởng kernel trick'],
  intuit: R`<p>Có hai nhóm học sinh đứng trên sân, bạn phải kẻ một vạch phấn chia hai nhóm. Có vô số vạch chia được. SVM chọn vạch sao cho <b>khoảng trống hai bên rộng nhất</b>, giống kẻ một con đường rộng nhất có thể giữa hai nhóm. Chỉ những học sinh đứng sát mép đường (vectơ hỗ trợ) quyết định vị trí con đường; những người đứng xa có đi đâu cũng không ảnh hưởng.</p>`,
  body: R`
<h4>Siêu phẳng và lề</h4>
<p>Phân loại: $\hat y = \text{sign}(\mathbf w\cdot\mathbf x + b)$, nhãn $y\in\{-1,+1\}$. Khoảng cách từ ranh giới tới đường lề là $1/\|\mathbf w\|$. Làm lề rộng nhất ⇔ làm $\|\mathbf w\|$ nhỏ nhất, với ràng buộc mọi điểm nằm đúng phía và ngoài lề: $y_i(\mathbf w\cdot\mathbf x_i + b)\ge1$.</p>
<h4>Lề mềm và hinge loss</h4>
<p>Dữ liệu thật có nhiễu, nên cho phép vi phạm và phạt:</p>
$$\min_{\mathbf w,b}\ \tfrac12\|\mathbf w\|^2 + C\sum_i\max\big(0,\ 1 - y_i(\mathbf w\cdot\mathbf x_i+b)\big)$$
<p>Hinge loss bằng 0 khi điểm đúng phía và ngoài lề; tăng tuyến tính khi điểm vào trong lề hoặc sai phía. $C$ lớn: phạt nặng vi phạm (lề hẹp); $C$ nhỏ: chấp nhận vài vi phạm để lề rộng.</p>
<h4>Kernel trick</h4>
<p>Dữ liệu không tách được bằng đường thẳng (như XOR) có thể tách được sau khi ánh xạ lên chiều cao hơn. SVM chỉ cần tích vô hướng giữa các điểm, nên thay $\mathbf x_i\cdot\mathbf x_j$ bằng hàm kernel $K(\mathbf x_i,\mathbf x_j)$, ví dụ RBF $\exp(-\gamma\|\mathbf x_i - \mathbf x_j\|^2)$, mà không cần tính ánh xạ tường minh.</p>
<h4>Vị trí hiện nay</h4>
<p>Trước 2012, SVM trên đặc trưng thiết kế tay (HOG, SIFT) là chuẩn cho thị giác. Ngày nay SVM vẫn hữu ích với dữ liệu nhỏ và đặc trưng tốt, ví dụ đặt trên embedding của CNN pretrained.</p>`,
  w: 'svm',
  worked: { t: 'Hinge loss cho 4 điểm',
    setup: R`$\mathbf w = [1, 1]$, $b = -3$. Điểm: $P_1=(3,2), y=+1$; $P_2=(2,1.5), y=+1$; $P_3=(1,1), y=-1$; $P_4=(2,2), y=-1$.`,
    steps: [
      R`<b>Giá trị $f = \mathbf w\cdot\mathbf x + b$:</b> $P_1$: $5-3 = 2$; $P_2$: $3.5-3 = 0.5$; $P_3$: $2 - 3 = -1$; $P_4$: $4-3 = 1$.`,
      R`<b>Lề $m = y\cdot f$:</b> $P_1$: 2; $P_2$: 0.5; $P_3$: 1; $P_4$: $-1$.`,
      R`<b>Hinge $\max(0, 1-m)$:</b> $P_1$: 0 (an toàn); $P_2$: 0.5 (đúng phía nhưng nằm trong lề); $P_3$: 0 (vừa chạm lề: vectơ hỗ trợ); $P_4$: 2 (sai phía).`,
      R`<b>Tổng hinge:</b> 2.5. Thành phần chuẩn: $\frac12\|\mathbf w\|^2 = 1$. Với $C=1$: mục tiêu $= 3.5$.`,
      R`<b>Độ rộng lề:</b> $2/\|\mathbf w\| = 2/1.414 = 1.414$.`,
    ],
    ans: R`Hinge $[0, 0.5, 0, 2]$; $P_4$ bị phân loại sai; mục tiêu = 3.5.` },
  ex: [
    { q: R`Kernel RBF với $\gamma = 0.5$: tính $K(\mathbf a, \mathbf b)$ cho $\mathbf a = (0,0)$, $\mathbf b = (1,1)$ và $\mathbf c = (2,2)$.`, s: [R`$\|\mathbf a - \mathbf b\|^2 = 2$ → $e^{-1} = 0.368$.`, R`$\|\mathbf a - \mathbf c\|^2 = 8$ → $e^{-4} = 0.018$.`], a: R`0.368 và 0.018: kernel RBF là “độ giống nhau” giảm nhanh theo khoảng cách.` },
  ],
  miss: [[R`Mọi điểm đều ảnh hưởng ranh giới SVM.`, R`Chỉ vectơ hỗ trợ (điểm trên hoặc trong lề) ảnh hưởng.`]],
  recap: [R`Lề rộng nhất ⇔ $\|\mathbf w\|$ nhỏ nhất.`, R`Hinge loss $\max(0, 1 - y f)$.`, R`Kernel trick: tách phi tuyến không cần ánh xạ tường minh.`],
  papers: ['Cortes & Vapnik (1995) — Support-vector networks'] });

L({ id: 'tree', p: 'pml', t: 'Cây quyết định', en: 'Decision Trees', min: 75, pre: ['mlbasics', 'prob'],
  goals: ['Tính độ hỗn tạp Gini và entropy', 'Chọn phép tách tốt nhất bằng tay', 'Hiểu vì sao cây dễ quá khớp'],
  intuit: R`<p>Trò chơi “20 câu hỏi”: “Có phải con vật không? Có sống dưới nước không?…” Mỗi câu hỏi tốt chia các khả năng thành hai nhóm “sạch” hơn. Cây quyết định học đúng điều này: tìm câu hỏi (đặc trưng + ngưỡng) làm các nhóm con <b>thuần nhất</b> nhất. Kết quả đọc được như một quy trình kiểm tra: “nếu độ rộng mạch &lt; 70 µm và độ sáng &lt; 0.3 thì NG”.</p>`,
  body: R`
<h4>Độ hỗn tạp</h4>
<p>Với tỷ lệ các lớp $p_1,\dots,p_K$ trong một nút:</p>
$$\text{Gini} = 1 - \sum_k p_k^2,\qquad \text{Entropy} = -\sum_k p_k\log_2 p_k$$
<p>Nút thuần nhất (một lớp) có Gini = 0. Nút 50/50 có Gini = 0.5, entropy = 1.</p>
<h4>Chọn phép tách</h4>
<p>Thử mọi đặc trưng, mọi ngưỡng. Với mỗi phép tách, tính hỗn tạp <b>trung bình có trọng số</b> của hai nút con. Chọn phép tách giảm hỗn tạp nhiều nhất (information gain). Lặp lại đệ quy cho từng nút con.</p>
<h4>Dừng và cắt tỉa</h4>
<p>Cây mọc tới khi mỗi lá thuần nhất sẽ học thuộc dữ liệu (quá khớp). Giới hạn độ sâu, số mẫu tối thiểu mỗi lá, hoặc cắt tỉa sau khi mọc.</p>
<h4>Ưu điểm</h4>
<p>Dễ giải thích, không cần chuẩn hóa, xử lý được đặc trưng hỗn hợp số và phân loại. Yếu điểm: một cây đơn lẻ không ổn định và kém chính xác, nên thực tế dùng <b>rừng</b> hoặc <b>boosting</b> (bài kế).</p>`,
  w: 'tree',
  worked: { t: 'Chọn câu hỏi đầu tiên cho 10 bo mạch',
    setup: R`10 bo: 4 NG, 6 OK. Tách theo “độ rộng &lt; 70 µm?”: nhánh Có gồm 3 NG + 1 OK; nhánh Không gồm 1 NG + 5 OK. Tách theo “độ sáng &lt; 0.3?”: nhánh Có 2 NG + 2 OK; nhánh Không 2 NG + 4 OK. Phép tách nào tốt hơn?`,
    steps: [
      R`<b>Gini gốc:</b> $1 - (0.4^2 + 0.6^2) = 1 - 0.52 = 0.48$.`,
      R`<b>Tách theo độ rộng – nhánh Có (3/1):</b> $1 - (0.75^2 + 0.25^2) = 1 - 0.625 = 0.375$. <b>Nhánh Không (1/5):</b> $1 - ((1/6)^2 + (5/6)^2) = 1 - 0.722 = 0.278$.`,
      R`<b>Trung bình có trọng số:</b> $\frac4{10}0.375 + \frac6{10}0.278 = 0.15 + 0.167 = 0.317$. Gain $= 0.48 - 0.317 = 0.163$.`,
      R`<b>Tách theo độ sáng – nhánh Có (2/2):</b> 0.5. <b>Nhánh Không (2/4):</b> $1 - ((1/3)^2+(2/3)^2) = 0.444$.`,
      R`<b>Trung bình:</b> $0.4\cdot0.5 + 0.6\cdot0.444 = 0.2 + 0.267 = 0.467$. Gain $= 0.013$.`,
      R`<b>Kết luận:</b> chọn “độ rộng &lt; 70 µm” làm nút gốc (gain 0.163 so với 0.013).`,
    ],
    ans: R`Tách theo độ rộng mạch (Gini giảm từ 0.48 còn 0.317).` },
  ex: [
    { q: R`Tính entropy của nút có 3 NG, 1 OK.`, s: [R`$p = [0.75, 0.25]$.`, R`$-0.75\log_2 0.75 = 0.75\cdot0.415 = 0.311$.`, R`$-0.25\log_2 0.25 = 0.25\cdot2 = 0.5$.`], a: R`Entropy $\approx 0.811$ bit.` },
  ],
  miss: [[R`Cây sâu hơn luôn chính xác hơn.`, R`Trên tập train thì có; trên dữ liệu mới thì thường tệ hơn vì quá khớp.`]],
  recap: [R`Gini $= 1 - \sum p_k^2$.`, R`Chọn phép tách giảm hỗn tạp trung bình có trọng số nhiều nhất.`, R`Dễ giải thích; dùng ensemble để mạnh hơn.`],
  papers: ['Breiman et al. (1984) — Classification and Regression Trees (CART)', 'Quinlan (1986) — ID3'] });

L({ id: 'ensemble', p: 'pml', t: 'Rừng ngẫu nhiên & Gradient Boosting', en: 'Random Forest & Boosting', min: 90, pre: ['tree', 'calculus'],
  goals: ['Phân biệt bagging và boosting', 'Tính tay vài vòng gradient boosting', 'Biết vì sao XGBoost/LightGBM thống trị dữ liệu bảng'],
  intuit: R`<p><b>Bagging / rừng ngẫu nhiên</b> như hỏi ý kiến 100 người, mỗi người chỉ được xem một phần dữ liệu và một vài tiêu chí, rồi bỏ phiếu. Từng người có thể sai, nhưng sai theo những cách khác nhau nên trung bình lại đúng hơn.</p>
<p><b>Boosting</b> như một nhóm thợ sửa nối tiếp: người thứ nhất làm thô, người thứ hai chỉ sửa <b>phần sai</b> của người thứ nhất, người thứ ba sửa phần sai còn lại… Mỗi người yếu, nhưng chuỗi người sửa liên tiếp cho kết quả rất tốt.</p>`,
  body: R`
<h4>Rừng ngẫu nhiên (bagging)</h4>
<ol><li>Tạo $B$ tập dữ liệu bằng lấy mẫu có hoàn lại (bootstrap).</li><li>Mỗi tập huấn luyện một cây sâu; ở mỗi nút chỉ xét ngẫu nhiên một phần đặc trưng.</li><li>Dự đoán: bỏ phiếu (phân loại) hoặc trung bình (hồi quy).</li></ol>
<p>Trung bình nhiều mô hình ít tương quan làm <b>giảm phương sai</b>. Rừng khó quá khớp hơn một cây và gần như không cần tinh chỉnh.</p>
<h4>Gradient boosting</h4>
<p>Xây mô hình cộng dồn $F_M(x) = F_0 + \eta\sum_{m=1}^M h_m(x)$, mỗi cây nhỏ $h_m$ khớp với <b>phần dư</b> (với MSE) hay tổng quát hơn là gradient âm của loss:</p>
$$r_i^{(m)} = -\frac{\partial\mathcal L(y_i, F)}{\partial F}\Big|_{F=F_{m-1}(x_i)}\quad(\text{MSE: } r_i = y_i - F_{m-1}(x_i))$$
<p>Đây chính là gradient descent, nhưng bước đi trong “không gian hàm” thay vì không gian tham số. Learning rate $\eta$ nhỏ (0.05–0.1) + nhiều cây thường tốt nhất.</p>
<h4>XGBoost, LightGBM, CatBoost</h4>
<p>Các bản cài đặt tối ưu: thêm điều chuẩn, dùng đạo hàm bậc hai, chia bin đặc trưng, xử lý giá trị thiếu. Trên dữ liệu bảng (dữ liệu sản xuất, chất lượng, tài chính), chúng vẫn thường thắng mạng nơ-ron.</p>`,
  w: 'boost',
  worked: { t: 'Ba vòng gradient boosting trên 4 điểm',
    setup: R`Dữ liệu $(x, y)$: $(1, 2), (2, 4), (3, 7), (4, 9)$. Mỗi “cây” là một gốc cây (stump) tách tại $x \le 2.5$, dự đoán trung bình phần dư mỗi bên. $\eta = 1$ (cho dễ tính).`,
    steps: [
      R`<b>$F_0$ = trung bình $y$:</b> $(2+4+7+9)/4 = 5.5$. Phần dư $r = [-3.5, -1.5, 1.5, 3.5]$.`,
      R`<b>Cây 1:</b> bên trái ($x\le2.5$): trung bình $(-3.5-1.5)/2 = -2.5$; bên phải: $2.5$. $F_1 = [3, 3, 8, 8]$.`,
      R`<b>Phần dư mới:</b> $y - F_1 = [-1, 1, -1, 1]$. MSE giảm từ $(12.25+2.25+2.25+12.25)/4 = 7.25$ xuống $1$.`,
      R`<b>Cây 2</b> cũng tách tại 2.5: trái trung bình $(-1+1)/2 = 0$, phải $0$. Không cải thiện! Stump tại 2.5 đã hết việc.`,
      R`<b>Cây 2 tách khác</b>, tại $x\le1.5$: trái ($x=1$): $-1$; phải ($x=2,3,4$): $(1-1+1)/3 = 0.333$. $F_2 = [2, 3.333, 8.333, 8.333]$; phần dư $[0, 0.667, -1.333, 0.667]$; MSE $= (0 + 0.444 + 1.778 + 0.444)/4 = 0.667$.`,
      R`<b>Bài học:</b> mỗi cây nhỏ chỉ cần sửa phần còn sai; thứ tự và vị trí tách được chọn lại ở mỗi vòng để giảm loss nhiều nhất.`,
    ],
    ans: R`MSE: 7.25 → 1.0 → 0.667 sau hai cây.` },
  ex: [
    { q: R`Bootstrap một tập 5 mẫu. Xác suất một mẫu cụ thể <b>không</b> được chọn lần nào? Với $n$ lớn?`, s: [R`Mỗi lần rút, xác suất không trúng là $4/5$.`, R`5 lần: $(0.8)^5 = 0.328$.`, R`$n$ lớn: $(1-1/n)^n\to e^{-1} = 0.368$.`], a: R`0.328; với $n$ lớn khoảng 36.8% mẫu nằm ngoài mỗi cây (dùng làm “out-of-bag” để đánh giá).` },
  ],
  miss: [[R`Boosting nhiều cây không bao giờ quá khớp.`, R`Có quá khớp nếu quá nhiều cây với $\eta$ lớn; dùng early stopping trên validation.`]],
  recap: [R`Bagging: nhiều cây song song, giảm phương sai.`, R`Boosting: cây nối tiếp, khớp phần dư/gradient.`, R`XGBoost/LightGBM: mặc định cho dữ liệu bảng.`],
  papers: ['Breiman (2001) — Random Forests', 'Friedman (2001) — Greedy Function Approximation: A Gradient Boosting Machine', 'Chen & Guestrin (2016) — XGBoost'] });

L({ id: 'kmeans', p: 'pml', t: 'Phân cụm k-means', en: 'k-Means Clustering', min: 60, pre: ['knn'],
  goals: ['Chạy tay các vòng gán–cập nhật của k-means', 'Chọn k bằng phương pháp khuỷu tay', 'Biết giới hạn của k-means'],
  intuit: R`<p>Chia 30 sinh viên thành 3 nhóm học sao cho mỗi người gần nhóm trưởng nhất. Ban đầu chọn bừa 3 nhóm trưởng. Mỗi người đứng về phía nhóm trưởng gần mình. Sau đó mỗi nhóm <b>dời “nhóm trưởng” tới giữa nhóm</b>. Lặp lại vài lần, các nhóm ổn định. Không ai cần nhãn: thuật toán tự tìm cấu trúc.</p>`,
  body: R`
<h4>Thuật toán (Lloyd)</h4>
<ol><li>Chọn $k$ tâm ban đầu (ngẫu nhiên, hoặc k-means++ để trải đều).</li>
<li><b>Gán:</b> mỗi điểm về tâm gần nhất.</li>
<li><b>Cập nhật:</b> mỗi tâm = trung bình các điểm của cụm.</li>
<li>Lặp đến khi không đổi.</li></ol>
<p>Hàm mục tiêu: tổng bình phương khoảng cách tới tâm (inertia) $J = \sum_i\|\mathbf x_i - \boldsymbol\mu_{c(i)}\|^2$. Mỗi bước gán và cập nhật đều không làm $J$ tăng, nên thuật toán hội tụ (tới cực tiểu cục bộ).</p>
<h4>Chọn k</h4>
<p>Vẽ $J$ theo $k$: $J$ luôn giảm khi $k$ tăng; chọn chỗ “khuỷu tay”, nơi tăng $k$ không còn giảm $J$ nhiều. Hoặc dùng chỉ số silhouette.</p>
<h4>Giới hạn</h4>
<p>Giả định cụm hình cầu, kích thước tương đương; nhạy với ngoại lai và với khởi tạo. Cụm hình dạng phức tạp dùng DBSCAN; cụm có xác suất dùng Gaussian Mixture (EM).</p>
<h4>Ứng dụng</h4>
<p>Gom nhóm các loại lỗi chưa đặt tên từ embedding ảnh, phân khúc khách hàng, lượng tử hóa màu, và chính VQ-VAE dùng ý tưởng sổ mã giống k-means.</p>`,
  w: 'kmeans',
  worked: { t: 'Một vòng k-means trên 6 điểm',
    setup: R`Điểm 1D: $[1, 2, 3, 8, 9, 10]$, $k=2$, tâm ban đầu $\mu_1 = 1$, $\mu_2 = 3$.`,
    steps: [
      R`<b>Gán vòng 1:</b> điểm 1 → $\mu_1$; điểm 2: cách $\mu_1$ 1, cách $\mu_2$ 1 (hòa, chọn $\mu_1$); 3, 8, 9, 10 → $\mu_2$.`,
      R`<b>Cập nhật:</b> $\mu_1 = (1+2)/2 = 1.5$; $\mu_2 = (3+8+9+10)/4 = 7.5$.`,
      R`<b>Gán vòng 2:</b> 1, 2, 3 gần 1.5 hơn (3 cách 1.5 là 1.5, cách 7.5 là 4.5) → cụm 1; 8, 9, 10 → cụm 2.`,
      R`<b>Cập nhật:</b> $\mu_1 = 2$, $\mu_2 = 9$.`,
      R`<b>Vòng 3:</b> gán không đổi → hội tụ. $J = (1+0+1) + (1+0+1) = 4$.`,
    ],
    ans: R`Cụm $\{1,2,3\}$ tâm 2 và $\{8,9,10\}$ tâm 9; $J = 4$.` },
  ex: [
    { q: R`Cùng dữ liệu, khởi tạo $\mu_1 = 9$, $\mu_2 = 10$. Kết quả sau khi hội tụ?`, s: [R`Gán: 1, 2, 3, 8, 9 → $\mu_1$ (gần 9 hơn 10); 10 → $\mu_2$.`, R`Cập nhật: $\mu_1 = 23/5 = 4.6$; $\mu_2 = 10$.`, R`Gán: 1, 2, 3 → 4.6; 8: cách 4.6 là 3.4, cách 10 là 2 → $\mu_2$; 9, 10 → $\mu_2$.`, R`Cập nhật: $\mu_1 = 2$, $\mu_2 = 9$. Hội tụ giống trước.`], a: R`Vẫn ra $\{1,2,3\}$ và $\{8,9,10\}$ sau 3 vòng. Dữ liệu tách rõ thì khởi tạo ít ảnh hưởng; dữ liệu phức tạp thì không như vậy.` },
  ],
  miss: [[R`k-means tìm được số cụm “đúng”.`, R`Bạn phải chọn $k$; thuật toán chỉ chia theo $k$ đã cho.`]],
  recap: [R`Lặp: gán về tâm gần nhất → cập nhật tâm = trung bình.`, R`Mục tiêu: tổng bình phương khoảng cách.`, R`Chọn $k$ bằng khuỷu tay hoặc silhouette.`],
  papers: ['Lloyd (1982) — Least squares quantization in PCM', 'Arthur & Vassilvitskii (2007) — k-means++'] });

L({ id: 'pca', p: 'pml', t: 'Giảm chiều: PCA', en: 'Principal Component Analysis', min: 75, pre: ['matmul', 'gauss'],
  goals: ['Tính ma trận hiệp phương sai và hướng chính', 'Chiếu dữ liệu xuống ít chiều hơn', 'Đọc tỷ lệ phương sai giải thích'],
  intuit: R`<p>Chụp ảnh một chiếc bút chì: chụp từ đầu bút thì chỉ thấy một chấm tròn (mất hết thông tin), chụp ngang thì thấy rõ cả chiều dài. PCA tìm <b>góc chụp giữ được nhiều thông tin nhất</b>, tức hướng mà dữ liệu trải rộng nhất. Hướng thứ hai vuông góc với hướng thứ nhất, và cứ thế.</p>`,
  body: R`
<h4>Các bước</h4>
<ol><li>Trừ trung bình mỗi đặc trưng.</li>
<li>Tính ma trận hiệp phương sai $\Sigma = \frac1n X^\top X$ ($d\times d$).</li>
<li>Tìm vectơ riêng và trị riêng của $\Sigma$: $\Sigma\mathbf v = \lambda\mathbf v$. Sắp $\lambda$ giảm dần.</li>
<li>Giữ $k$ vectơ riêng đầu tiên làm trục mới; chiếu: $Z = XV_k$.</li></ol>
<p>Trị riêng $\lambda_j$ là phương sai dữ liệu theo trục $j$. Tỷ lệ giải thích $= \lambda_j/\sum\lambda$.</p>
<h4>Dùng để làm gì</h4>
<ul><li>Trực quan hóa dữ liệu nhiều chiều (cùng với t-SNE, UMAP).</li><li>Nén đặc trưng, khử nhiễu, tăng tốc mô hình phía sau.</li><li>Phát hiện bất thường: lỗi tái tạo sau khi chiếu xuống rồi chiếu ngược lên (giống autoencoder tuyến tính). PaDiM dùng giảm chiều ngẫu nhiên theo tinh thần tương tự.</li></ul>
<h4>Liên hệ</h4>
<p>PCA chính là autoencoder <b>tuyến tính</b> tối ưu với loss MSE. Autoencoder phi tuyến là bản mở rộng của PCA.</p>`,
  w: 'pca',
  worked: { t: 'PCA cho 4 điểm 2D',
    setup: R`Dữ liệu đã trừ trung bình: $(2, 2), (-2, -2), (1, -1), (-1, 1)$.`,
    steps: [
      R`<b>Hiệp phương sai:</b> $\text{Var}(x) = (4+4+1+1)/4 = 2.5$; $\text{Var}(y) = 2.5$; $\text{Cov}(x,y) = (4+4-1-1)/4 = 1.5$. $\Sigma = \begin{bmatrix}2.5&1.5\\1.5&2.5\end{bmatrix}$.`,
      R`<b>Trị riêng:</b> ma trận dạng $\begin{bmatrix}a&b\\b&a\end{bmatrix}$ có trị riêng $a\pm b$: $\lambda_1 = 4$, $\lambda_2 = 1$.`,
      R`<b>Vectơ riêng:</b> $\mathbf v_1 = \frac1{\sqrt2}[1,1]$ (đường chéo), $\mathbf v_2 = \frac1{\sqrt2}[1,-1]$. Kiểm tra: $\Sigma[1,1] = [4,4] = 4\cdot[1,1]$ ✓.`,
      R`<b>Tỷ lệ giải thích:</b> $4/5 = 80\%$ theo trục 1, $20\%$ theo trục 2.`,
      R`<b>Chiếu xuống 1 chiều:</b> $z = \mathbf x\cdot\mathbf v_1$: $(2,2)\to 4/\sqrt2 = 2.83$; $(-2,-2)\to-2.83$; $(1,-1)\to0$; $(-1,1)\to0$. Phương sai của $z$: $(8+8+0+0)/4 = 4 = \lambda_1$ ✓.`,
    ],
    ans: R`Trục chính $[1,1]/\sqrt2$, giữ 80% phương sai; $z = [2.83, -2.83, 0, 0]$.` },
  ex: [
    { q: R`Trị riêng của một tập 5 đặc trưng: $[6, 2, 1, 0.6, 0.4]$. Cần giữ mấy thành phần để giải thích ≥ 90% phương sai?`, s: [R`Tổng $= 10$.`, R`Cộng dồn: 60%, 80%, 90%.`], a: R`3 thành phần.` },
  ],
  miss: [[R`PCA chọn các đặc trưng quan trọng nhất trong số đặc trưng gốc.`, R`PCA tạo đặc trưng <b>mới</b> là tổ hợp tuyến tính của mọi đặc trưng gốc.`], [R`Không cần chuẩn hóa trước PCA.`, R`Đặc trưng có đơn vị lớn sẽ chiếm trục chính. Thường chuẩn hóa trước.`]],
  recap: [R`Trừ trung bình → hiệp phương sai → vectơ riêng.`, R`Trị riêng = phương sai theo trục.`, R`PCA = autoencoder tuyến tính.`],
  papers: ['Pearson (1901) — On lines and planes of closest fit', 'Jolliffe — Principal Component Analysis'] });

L({ id: 'nbayes', p: 'pml', t: 'Định lý Bayes & Naive Bayes', en: 'Bayes Rule & Naive Bayes', min: 60, pre: ['prob'],
  goals: ['Áp dụng định lý Bayes bằng tay', 'Hiểu giả định “ngây thơ” độc lập có điều kiện', 'Dùng làm mịn Laplace'],
  intuit: R`<p>Máy kiểm tra báo một bo bị lỗi. Máy rất nhạy (bắt 99% lỗi) và ít báo giả (2%). Nhưng chỉ 1% bo thật sự lỗi. Hỏi: bo bị báo lỗi có thật sự lỗi không? Trực giác nói “gần như chắc chắn”, nhưng Bayes cho ra chỉ khoảng <b>33%</b>, vì số bo tốt quá đông nên 2% báo giả của chúng vẫn nhiều hơn số lỗi thật. Bayes dạy ta cập nhật niềm tin đúng cách khi có bằng chứng mới.</p>`,
  body: R`
<h4>Định lý Bayes</h4>
$$P(A\mid B) = \frac{P(B\mid A)\,P(A)}{P(B)},\qquad P(B) = \sum_a P(B\mid a)P(a)$$
<p>$P(A)$: niềm tin trước (prior). $P(B\mid A)$: khả năng (likelihood). $P(A\mid B)$: niềm tin sau khi thấy bằng chứng (posterior).</p>
<h4>Naive Bayes</h4>
<p>Với đặc trưng $x_1,\dots,x_d$, giả định chúng <b>độc lập khi đã biết lớp</b>:</p>
$$P(y\mid x_1..x_d)\propto P(y)\prod_{j} P(x_j\mid y)$$
<p>Giả định “ngây thơ” này hầu như không bao giờ đúng, nhưng mô hình vẫn phân loại tốt (đặc biệt văn bản), huấn luyện cực nhanh (chỉ đếm), cần ít dữ liệu.</p>
<h4>Làm mịn Laplace</h4>
<p>Nếu một từ chưa từng xuất hiện trong lớp, $P=0$ làm cả tích bằng 0. Cộng 1 vào mọi số đếm: $P(w\mid y) = \frac{\text{đếm}(w,y)+1}{\text{tổng}(y)+V}$.</p>
<h4>Bayes ở khắp nơi</h4>
<p>Lọc spam, phân loại ghi chú kỹ thuật, chẩn đoán; và là nền của mạng Bayes, HMM, bộ lọc Kalman (giai đoạn 8), cũng như cách hiểu loss như likelihood.</p>`,
  w: 'nbayes',
  worked: { t: 'Bo bị báo lỗi có thật sự lỗi không?',
    setup: R`$P(\text{lỗi}) = 0.01$. Máy báo lỗi với xác suất $0.99$ nếu bo lỗi, $0.02$ nếu bo tốt. Tính $P(\text{lỗi}\mid\text{báo})$.`,
    steps: [
      R`<b>Tử số:</b> $P(\text{báo}\mid\text{lỗi})P(\text{lỗi}) = 0.99\cdot0.01 = 0.0099$.`,
      R`<b>Báo giả:</b> $P(\text{báo}\mid\text{tốt})P(\text{tốt}) = 0.02\cdot0.99 = 0.0198$.`,
      R`<b>Mẫu số:</b> $P(\text{báo}) = 0.0099 + 0.0198 = 0.0297$.`,
      R`<b>Posterior:</b> $0.0099/0.0297 = 0.333$.`,
      R`<b>Bằng số đếm cho dễ hình dung:</b> 10.000 bo → 100 lỗi (99 bị báo) và 9.900 tốt (198 bị báo). Trong 297 bo bị báo, chỉ 99 lỗi thật: 33%.`,
      R`<b>Kiểm tra lần 2 độc lập</b> (máy khác, cùng thông số): prior mới 0.333. Tử $= 0.99\cdot0.333 = 0.330$; báo giả $= 0.02\cdot0.667 = 0.0133$; posterior $= 0.330/0.343 = 0.961$.`,
    ],
    ans: R`Sau 1 lần báo: 33%. Sau 2 lần báo độc lập: 96%.` },
  ex: [
    { q: R`Phân loại ghi chú vận hành “báo giả” hay “lỗi thật”. Trong 10 ghi chú lỗi thật, từ “đứt” xuất hiện 6 lần, “bụi” 1 lần; trong 10 ghi chú báo giả, “đứt” 1, “bụi” 7. Prior 0.5/0.5. Ghi chú mới chứa cả “đứt” và “bụi”. (Coi xác suất mỗi từ = số ghi chú chứa từ / 10, không làm mịn.)`, s: [R`Lỗi thật: $0.5\cdot0.6\cdot0.1 = 0.03$.`, R`Báo giả: $0.5\cdot0.1\cdot0.7 = 0.035$.`, R`Chuẩn hóa: lỗi thật $= 0.03/0.065 = 0.46$.`], a: R`46% lỗi thật, 54% báo giả: hơi nghiêng về báo giả.` },
  ],
  miss: [[R`Máy nhạy 99% thì kết quả dương tính đúng 99%.`, R`Còn phụ thuộc tỷ lệ nền (prior). Lớp hiếm làm posterior thấp hơn nhiều.`]],
  recap: [R`Posterior ∝ likelihood × prior.`, R`Naive Bayes: nhân xác suất từng đặc trưng.`, R`Làm mịn Laplace tránh xác suất 0.`],
  papers: ['Russell & Norvig — chương 12: Quantifying Uncertainty'] });

/* ===== Giai đoạn: AI biểu tượng, xác suất & tiến hóa ===== */
L({ id: 'search', p: 'psym', t: 'Tìm kiếm: BFS, Dijkstra, A*', en: 'Search & A*', min: 90, pre: ['aitypes'],
  goals: ['Mô hình hóa bài toán thành trạng thái và hành động', 'Chạy tay BFS và A*', 'Hiểu heuristic chấp nhận được'],
  intuit: R`<p>Tìm đường trong mê cung bằng cách nào? <b>BFS</b> như đổ nước vào lối vào: nước lan đều mọi ngả, tới đích theo đường ngắn nhất về số bước, nhưng lan khắp nơi. <b>A*</b> như người có la bàn chỉ hướng đích: vẫn thận trọng, nhưng ưu tiên lối đi vừa đã đi ít vừa “có vẻ” gần đích. Google Maps, robot kho, nhân vật trong game đều dùng ý tưởng này.</p>`,
  body: R`
<h4>Mô hình hóa</h4>
<p>Một bài toán tìm kiếm gồm: trạng thái đầu, tập hành động, mô hình chuyển trạng thái, kiểm tra đích, chi phí mỗi bước. Lời giải là chuỗi hành động từ đầu tới đích.</p>
<h4>Không có thông tin</h4>
<ul><li><b>BFS:</b> mở rộng theo từng lớp độ sâu; tối ưu khi mọi bước cùng chi phí.</li>
<li><b>DFS:</b> đi sâu một nhánh trước; tốn ít bộ nhớ, không đảm bảo tối ưu.</li>
<li><b>Dijkstra (uniform cost):</b> luôn mở rộng nút có tổng chi phí $g(n)$ nhỏ nhất; tối ưu với chi phí không âm.</li></ul>
<h4>A*</h4>
$$f(n) = g(n) + h(n)$$
<p>$g(n)$: chi phí đã đi; $h(n)$: ước lượng chi phí còn lại tới đích. Luôn mở rộng nút có $f$ nhỏ nhất. Nếu $h$ <b>không bao giờ ước lượng quá</b> chi phí thật (chấp nhận được), A* tìm ra đường tối ưu. Ví dụ trên lưới: khoảng cách Manhattan $|x-x^*| + |y-y^*|$.</p>
<h4>Ngày nay</h4>
<p>Tìm kiếm vẫn là xương sống của lập lịch, định tuyến, lập kế hoạch robot; và kết hợp với học sâu trong AlphaGo (MCTS), và trong cách các LLM “suy luận” bằng cách thử nhiều hướng rồi chọn.</p>`,
  w: 'astar',
  worked: { t: 'A* trên đồ thị 5 thành phố',
    setup: R`Cạnh (km): S–A 2, S–B 5, A–B 2, A–C 6, B–C 2, C–G 1, B–G 6. Heuristic (đường chim bay tới G): $h(S)=6, h(A)=5, h(B)=3, h(C)=1, h(G)=0$. Tìm đường S → G.`,
    steps: [
      R`<b>Mở S:</b> $g=0$. Hàng đợi: A ($g=2$, $f=2+5=7$), B ($g=5$, $f=5+3=8$).`,
      R`<b>Lấy A</b> ($f=7$ nhỏ nhất). Láng giềng: B qua A: $g=4$, $f=7$ (tốt hơn B cũ $g=5$, cập nhật); C qua A: $g=8$, $f=9$.`,
      R`<b>Hàng đợi:</b> B ($f=7$), C ($f=9$). <b>Lấy B</b> ($g=4$). Láng giềng: C qua B: $g=6$, $f=7$ (tốt hơn 8, cập nhật); G qua B: $g=10$, $f=10$.`,
      R`<b>Hàng đợi:</b> C ($f=7$), G ($f=10$). <b>Lấy C</b> ($g=6$). G qua C: $g=7$, $f=7$ (tốt hơn 10).`,
      R`<b>Lấy G</b> ($f=7$): tới đích. Truy ngược: G ← C ← B ← A ← S.`,
      R`<b>Kết quả:</b> S → A → B → C → G, dài $2+2+2+1 = 7$ km. Đường trực tiếp S → B → G dài 11; S → B → C → G dài 8. A* chỉ mở 4 nút thay vì quét toàn bộ.`,
    ],
    ans: R`S–A–B–C–G, tổng 7 km.` },
  ex: [
    { q: R`Trên lưới 5×5 không vật cản, đi 4 hướng, từ (0,0) tới (4,4). Heuristic Manhattan tại (0,0)? Có chấp nhận được không? Nếu dùng $h = 2\times$Manhattan?`, s: [R`$h = 4 + 4 = 8$.`, R`Đường ngắn nhất thật cũng là 8 bước, nên $h$ không vượt quá: chấp nhận được.`, R`$h = 16 > 8$: ước lượng quá, A* chạy nhanh hơn nhưng có thể trả đường không tối ưu khi có vật cản.`], a: R`8; chấp nhận được. $2\times$ Manhattan không còn đảm bảo tối ưu.` },
  ],
  miss: [[R`Heuristic càng lớn càng tốt.`, R`Lớn quá (vượt chi phí thật) thì mất đảm bảo tối ưu. Heuristic tốt là sát nhưng không vượt.`]],
  recap: [R`Bài toán = trạng thái, hành động, chi phí, đích.`, R`A*: $f = g + h$, mở nút $f$ nhỏ nhất.`, R`$h$ chấp nhận được ⇒ đường tối ưu.`],
  papers: ['Hart, Nilsson & Raphael (1968) — A formal basis for the heuristic determination of minimum cost paths', 'Russell & Norvig — chương 3'] });

L({ id: 'games', p: 'psym', t: 'Trò chơi đối kháng: Minimax & MCTS', en: 'Adversarial Search', min: 75, pre: ['search'],
  goals: ['Tính minimax trên cây trò chơi', 'Cắt tỉa alpha–beta bằng tay', 'Hiểu MCTS trong AlphaGo'],
  intuit: R`<p>Chơi cờ tướng, bạn nghĩ: “nếu mình đi nước này, đối thủ sẽ đáp trả <b>tệ nhất cho mình</b>, rồi mình lại chọn nước tốt nhất…” Minimax chính là suy nghĩ đó: mình tối đa hóa, đối thủ tối thiểu hóa, xen kẽ từng tầng. Alpha–beta là mẹo “thôi khỏi xét nhánh này nữa, đằng nào đối thủ cũng không để mình đi tới đó”.</p>`,
  body: R`
<h4>Minimax</h4>
$$V(s) = \begin{cases}\text{điểm}(s) & s \text{ là lá}\\ \max_a V(s') & \text{lượt MAX}\\ \min_a V(s') & \text{lượt MIN}\end{cases}$$
<p>Tính từ lá ngược lên gốc. Với cờ thật, cây quá lớn ($\sim35^{80}$ với cờ vua), nên cắt ở độ sâu cố định và dùng <b>hàm đánh giá</b> (đếm quân, vị trí).</p>
<h4>Cắt tỉa alpha–beta</h4>
<p>$\alpha$: giá trị tốt nhất MAX đã chắc chắn có; $\beta$: giá trị tốt nhất MIN đã chắc chắn có. Khi $\alpha\ge\beta$ ở một nút, các nhánh còn lại không thể ảnh hưởng kết quả, bỏ qua. Kết quả giống hệt minimax, nhưng duyệt ít hơn nhiều (lý tưởng: căn bậc hai số nút).</p>
<h4>MCTS và AlphaGo</h4>
<p>Cờ vây quá lớn cho minimax. Monte Carlo Tree Search lặp 4 bước: <b>chọn</b> nhánh hứa hẹn (cân bằng khai thác/khám phá), <b>mở rộng</b>, <b>mô phỏng</b> ván đấu tới cuối, <b>lan truyền ngược</b> kết quả. AlphaGo thay mô phỏng ngẫu nhiên bằng <b>mạng giá trị</b> và hướng dẫn chọn nước bằng <b>mạng chính sách</b>: kết hợp tìm kiếm biểu tượng với học sâu và RL.</p>`,
  w: 'minimax',
  worked: { t: 'Minimax và alpha–beta trên cây 2 tầng',
    setup: R`Gốc là lượt MAX, có 3 nước A, B, C. Mỗi nước dẫn tới lượt MIN với các lá: A → $[3, 12, 8]$; B → $[2, 4, 6]$; C → $[14, 5, 2]$.`,
    steps: [
      R`<b>MIN tại A:</b> $\min(3,12,8) = 3$.`,
      R`<b>MIN tại B:</b> $\min(2,4,6) = 2$. <b>MIN tại C:</b> $\min(14,5,2) = 2$.`,
      R`<b>MAX tại gốc:</b> $\max(3,2,2) = 3$ → chọn A.`,
      R`<b>Alpha–beta:</b> sau khi xét A, $\alpha = 3$ (MAX chắc có ít nhất 3).`,
      R`<b>Xét B:</b> lá đầu tiên là 2, nên MIN ở B sẽ $\le 2 < \alpha = 3$. MAX sẽ không chọn B: bỏ qua lá 4, 6.`,
      R`<b>Xét C:</b> lá 14 (MIN tại C hiện $\le14$, chưa cắt), lá 5 ($\le5$, chưa cắt vì $5 > 3$), lá 2 ($\le2<3$). Không bỏ được lá nào ở C.`,
      R`<b>Tiết kiệm:</b> 2/9 lá. Nếu sắp nước tốt lên trước (thứ tự tốt), cắt được nhiều hơn.`,
    ],
    ans: R`Giá trị gốc 3, chọn A; alpha–beta bỏ qua 2 lá.` },
  ex: [
    { q: R`Đổi thứ tự lá của C thành $[2, 5, 14]$. Alpha–beta bỏ qua được bao nhiêu lá ở C?`, s: [R`Lá đầu 2 ≤ $\alpha = 3$: cắt ngay.`, R`Bỏ qua 5 và 14.`], a: R`2 lá; tổng cộng bỏ 4/9 lá.` },
  ],
  miss: [[R`Máy chơi cờ duyệt hết mọi nước đi.`, R`Không thể; chúng cắt độ sâu, dùng hàm đánh giá, alpha–beta, hoặc MCTS + mạng nơ-ron.`]],
  recap: [R`MAX lấy max, MIN lấy min, tính từ lá lên.`, R`Alpha–beta: cùng kết quả, duyệt ít hơn.`, R`AlphaGo = MCTS + mạng chính sách + mạng giá trị.`],
  papers: ['Knuth & Moore (1975) — An analysis of alpha-beta pruning', 'Silver et al. (2016) — Mastering the game of Go'] });

L({ id: 'logic', p: 'psym', t: 'Logic, hệ chuyên gia & đồ thị tri thức', en: 'Logic & Knowledge', min: 75, pre: ['aitypes'],
  goals: ['Suy diễn tiến (forward chaining) trên tập luật', 'Biểu diễn tri thức bằng bộ ba chủ–vị–tân', 'Biết vai trò của tri thức biểu tượng cạnh LLM'],
  intuit: R`<p>Một kỹ sư lâu năm có hàng trăm “nếu… thì…” trong đầu: “nếu mối hàn xám và có lỗ thì nghi rỗ khí; nếu rỗ khí và nhiệt độ lò thấp thì chỉnh profile nhiệt”. <b>Hệ chuyên gia</b> ghi những luật đó ra và để máy tự suy diễn. Ưu điểm: giải thích được từng bước. Nhược điểm: viết và bảo trì hàng nghìn luật rất cực, và luật không tự học.</p>`,
  body: R`
<h4>Logic mệnh đề và vị từ</h4>
<p>Mệnh đề: “$P\Rightarrow Q$” (nếu P thì Q). Logic vị từ bậc nhất thêm biến và lượng từ: $\forall x\,(\text{BoMạch}(x)\land\text{ĐứtMạch}(x)\Rightarrow\text{NG}(x))$.</p>
<h4>Suy diễn</h4>
<ul><li><b>Suy diễn tiến:</b> từ sự kiện đã biết, áp mọi luật có điều kiện thỏa mãn, thêm kết luận mới, lặp đến khi không thêm được gì.</li>
<li><b>Suy diễn lùi:</b> từ mục tiêu cần chứng minh, tìm luật kết luận ra nó, rồi chứng minh các điều kiện (cách Prolog làm).</li></ul>
<h4>Đồ thị tri thức</h4>
<p>Tri thức dạng bộ ba (chủ thể, quan hệ, đối tượng): (R12, gắn_trên, BoA), (R12, loại, ĐiệnTrở), (ĐiệnTrở, là_một, LinhKiện). Truy vấn bằng SPARQL hoặc duyệt đồ thị. Google Knowledge Graph, Wikidata là ví dụ lớn.</p>
<h4>Bên cạnh LLM</h4>
<p>LLM giỏi ngôn ngữ nhưng có thể sai sự thật và khó kiểm chứng; hệ biểu tượng chính xác, kiểm chứng được nhưng cứng nhắc. Xu hướng <b>neuro-symbolic</b>: LLM gọi bộ giải logic, công cụ tính toán, đồ thị tri thức (GraphRAG), hoặc sinh chứng minh để bộ kiểm tra hình thức xác minh.</p>`,
  w: 'chain',
  worked: { t: 'Suy diễn tiến trong hệ chẩn đoán mối hàn',
    setup: R`Luật: (L1) Xám ∧ CóLỗ ⇒ RỗKhí. (L2) RỗKhí ∧ NhiệtThấp ⇒ ChỉnhProfile. (L3) Bóng ∧ ĐủThiếc ⇒ HànTốt. (L4) RỗKhí ⇒ NG. Sự kiện ban đầu: {Xám, CóLỗ, NhiệtThấp}.`,
    steps: [
      R`<b>Vòng 1:</b> L1 thỏa (Xám, CóLỗ có trong tập) → thêm <b>RỗKhí</b>. L2 cần RỗKhí: lúc bắt đầu vòng chưa có. L3 không thỏa.`,
      R`<b>Vòng 2:</b> L2 thỏa (RỗKhí, NhiệtThấp) → thêm <b>ChỉnhProfile</b>. L4 thỏa → thêm <b>NG</b>.`,
      R`<b>Vòng 3:</b> không luật nào thêm được sự kiện mới → dừng.`,
      R`<b>Giải thích được:</b> NG vì RỗKhí (L4); RỗKhí vì Xám và CóLỗ (L1). Đây là điểm mạnh mà mạng nơ-ron thiếu.`,
    ],
    ans: R`Kết luận: RỗKhí, NG, ChỉnhProfile.` },
  ex: [
    { q: R`Viết các bộ ba cho câu: “Tụ C5 loại gốm 100nF, gắn trên bo B2, bị lỗi lệch vị trí.”`, s: [R`(C5, loại, TụGốm); (C5, điện_dung, 100nF).`, R`(C5, gắn_trên, B2).`, R`(C5, có_lỗi, LệchVịTrí).`], a: R`4 bộ ba như trên; từ đó truy vấn được “mọi linh kiện lệch vị trí trên B2”.` },
  ],
  miss: [[R`AI biểu tượng đã lỗi thời.`, R`Vẫn có mặt trong kiểm chứng phần mềm, lập lịch, cơ sở tri thức, và ngày càng được kết hợp với LLM.`]],
  recap: [R`Luật “nếu–thì” + suy diễn tiến/lùi.`, R`Đồ thị tri thức: bộ ba chủ–vị–tân.`, R`Neuro-symbolic: kết hợp LLM với logic và tri thức.`],
  papers: ['Russell & Norvig — chương 7–10', 'Buchanan & Shortliffe (1984) — Rule-Based Expert Systems: MYCIN'] });

L({ id: 'planning', p: 'psym', t: 'Lập kế hoạch & thỏa mãn ràng buộc', en: 'Planning & CSP', min: 60, pre: ['search', 'logic'],
  goals: ['Mô tả hành động bằng điều kiện và hiệu ứng (STRIPS)', 'Giải bài toán ràng buộc bằng quay lui', 'Liên hệ với lập lịch sản xuất'],
  intuit: R`<p>Nấu bữa tối: muốn “luộc mì” thì cần “có nước sôi”; muốn “nước sôi” thì cần “nồi có nước” và “bếp bật”. Lập kế hoạch là xâu chuỗi các hành động sao cho điều kiện của mỗi bước được đáp ứng bởi bước trước. <b>Bài toán ràng buộc</b> như xếp lịch thi: mỗi môn một ca, hai môn có chung sinh viên không được cùng ca, phòng không quá sức chứa.</p>`,
  body: R`
<h4>STRIPS</h4>
<p>Mỗi hành động có <b>điều kiện</b> (preconditions) và <b>hiệu ứng</b> (thêm / xóa sự kiện). Ví dụ: <i>Hàn(L)</i>: điều kiện {Đặt(L), MỏHànNóng}; hiệu ứng thêm {Hàn(L)}. Kế hoạch tìm bằng tìm kiếm tiến (từ trạng thái đầu) hoặc lùi (từ mục tiêu), với heuristic như A*.</p>
<h4>Bài toán thỏa mãn ràng buộc (CSP)</h4>
<p>Biến, miền giá trị, ràng buộc. Giải bằng <b>quay lui</b>: gán từng biến, kiểm ràng buộc, sai thì lùi lại. Tăng tốc: chọn biến ít lựa chọn nhất trước (MRV), loại trừ giá trị trước (forward checking).</p>
<h4>Ứng dụng công nghiệp</h4>
<p>Lập lịch máy, xếp ca, định tuyến xe, cân bằng chuyền: thường mô hình hóa bằng CSP hoặc quy hoạch nguyên (MILP) và giải bằng bộ giải chuyên dụng (OR-Tools, Gurobi). RL và học sâu đang được dùng để <b>học heuristic</b> cho các bộ giải này.</p>`,
  w: null,
  diag: { nodes: [{ t: 'ĐặtLinhKiện', s: 'cần: bo trống' }, { t: 'BậtMỏHàn', s: '→ nóng' }, { t: 'Hàn', s: 'cần: đặt + nóng', c: 'red' }, { t: 'KiểmTraAOI', s: 'cần: đã hàn' }, 'Hoàn thành'] },
  worked: { t: 'Tô màu lịch thi bằng quay lui',
    setup: R`4 môn: Toán (T), Lý (L), Hóa (H), Sinh (S). Cặp có chung sinh viên (không được cùng ca): T–L, T–H, L–H, H–S. Có 3 ca: 1, 2, 3.`,
    steps: [
      R`<b>Chọn biến ràng buộc nhiều nhất trước:</b> H (nối T, L, S). Gán H = 1.`,
      R`<b>T:</b> khác H → thử 2. OK. <b>L:</b> khác T và H → không được 1, 2 → gán 3.`,
      R`<b>S:</b> chỉ cần khác H (1) → gán 2.`,
      R`<b>Kiểm tra mọi ràng buộc:</b> T(2)≠L(3) ✓, T(2)≠H(1) ✓, L(3)≠H(1) ✓, H(1)≠S(2) ✓.`,
      R`<b>Nếu chỉ có 2 ca:</b> T, L, H đôi một ràng buộc (tam giác) nên cần ít nhất 3 ca: quay lui sẽ thử hết và báo vô nghiệm.`,
    ],
    ans: R`H = 1, T = 2, L = 3, S = 2. Cần tối thiểu 3 ca.` },
  ex: [
    { q: R`Hành động <i>KiểmTraAOI</i> có điều kiện {ĐãHàn}. Trạng thái đầu {BoTrống}. Dùng các hành động trong sơ đồ, viết kế hoạch ngắn nhất.`, s: [R`Mục tiêu cần KiểmTraAOI → cần ĐãHàn.`, R`Hàn cần Đặt và MỏHànNóng.`, R`Đặt cần BoTrống (có sẵn); BậtMỏHàn không cần gì.`], a: R`ĐặtLinhKiện → BậtMỏHàn → Hàn → KiểmTraAOI (có thể đổi chỗ hai bước đầu).` },
  ],
  miss: [[R`Lập lịch là việc của học máy.`, R`Phần lõi thường là tối ưu tổ hợp/CSP; học máy hỗ trợ dự báo đầu vào và học heuristic.`]],
  recap: [R`STRIPS: điều kiện + hiệu ứng.`, R`CSP: biến, miền, ràng buộc; giải bằng quay lui + heuristic.`, R`Nền tảng của lập lịch sản xuất.`],
  papers: ['Fikes & Nilsson (1971) — STRIPS', 'Russell & Norvig — chương 6, 11'] });

L({ id: 'bayesnet', p: 'psym', t: 'Mạng Bayes', en: 'Bayesian Networks', min: 75, pre: ['nbayes'],
  goals: ['Đọc đồ thị nhân quả và bảng xác suất có điều kiện', 'Suy luận bằng liệt kê', 'Hiểu “giải thích loại trừ” (explaining away)'],
  intuit: R`<p>Sáng ra thấy sân ướt. Có thể do <b>mưa</b>, cũng có thể do <b>vòi tưới tự động</b>. Nếu sau đó bạn biết tối qua trời mưa, khả năng vòi tưới đã chạy <b>giảm xuống</b>: mưa đã “giải thích” sân ướt rồi. Mạng Bayes là bản đồ các nguyên nhân và hệ quả như vậy, kèm con số, để máy lập luận dưới sự không chắc chắn.</p>`,
  body: R`
<h4>Cấu trúc</h4>
<p>Đồ thị có hướng không chu trình: mỗi nút là một biến, mũi tên từ nguyên nhân tới hệ quả. Mỗi nút có bảng xác suất có điều kiện $P(X\mid\text{cha}(X))$. Phân phối chung:</p>
$$P(X_1,\dots,X_n) = \prod_i P(X_i\mid\text{cha}(X_i))$$
<p>Thay vì $2^n$ con số cho $n$ biến nhị phân, chỉ cần vài bảng nhỏ.</p>
<h4>Suy luận</h4>
<p>Muốn $P(\text{Mưa}\mid\text{Ướt})$: cộng phân phối chung trên các biến ẩn (liệt kê), rồi chuẩn hóa. Mạng lớn dùng loại biến (variable elimination) hoặc lấy mẫu (MCMC).</p>
<h4>Ứng dụng</h4>
<p>Chẩn đoán y tế và kỹ thuật (tìm nguyên nhân gốc lỗi trên dây chuyền), đánh giá rủi ro, lọc spam. Mạng Bayes là nền cho suy luận nhân quả, mô hình đồ thị xác suất, HMM (bài kế).</p>`,
  w: 'bnet',
  worked: { t: 'Mưa hay vòi tưới?',
    setup: R`$P(M) = 0.2$, $P(V) = 0.3$ (độc lập). $P(\text{Ướt}\mid M, V)$: cả hai 0.99; chỉ mưa 0.9; chỉ vòi 0.8; không cái nào 0.05. Thấy sân ướt. Tính $P(M\mid\text{Ướt})$, rồi $P(V\mid\text{Ướt}, M)$ so với $P(V\mid\text{Ướt})$.`,
    steps: [
      R`<b>Liệt kê 4 trường hợp (nhân prior × likelihood):</b> (M,V): $0.2\cdot0.3\cdot0.99 = 0.0594$; (M,¬V): $0.2\cdot0.7\cdot0.9 = 0.126$; (¬M,V): $0.8\cdot0.3\cdot0.8 = 0.192$; (¬M,¬V): $0.8\cdot0.7\cdot0.05 = 0.028$.`,
      R`<b>Tổng</b> $P(\text{Ướt}) = 0.0594+0.126+0.192+0.028 = 0.4054$.`,
      R`<b>$P(M\mid\text{Ướt})$</b> $= (0.0594+0.126)/0.4054 = 0.457$. Thấy ướt, khả năng mưa tăng từ 20% lên 46%.`,
      R`<b>$P(V\mid\text{Ướt})$</b> $= (0.0594 + 0.192)/0.4054 = 0.620$.`,
      R`<b>Biết thêm là có mưa:</b> chỉ còn 2 trường hợp có M: $P(V\mid\text{Ướt}, M) = 0.0594/(0.0594+0.126) = 0.320$.`,
      R`<b>Giải thích loại trừ:</b> xác suất vòi tưới giảm từ 62% về 32% (gần prior 30%) vì mưa đã giải thích sân ướt.`,
    ],
    ans: R`$P(M\mid\text{Ướt}) = 0.457$; $P(V\mid\text{Ướt}) = 0.620$ giảm xuống $0.320$ khi biết có mưa.` },
  ex: [
    { q: R`Mạng 5 biến nhị phân dạng chuỗi A → B → C → D → E. Cần bao nhiêu con số xác suất độc lập? So với bảng phân phối chung đầy đủ?`, s: [R`A: 1 số. Mỗi nút còn lại có 1 cha nhị phân: 2 số, ×4 nút = 8.`, R`Tổng 9.`, R`Bảng đầy đủ: $2^5 - 1 = 31$.`], a: R`9 so với 31; với 30 biến: 59 so với hơn 1 tỷ.` },
  ],
  miss: [[R`Mũi tên trong mạng Bayes luôn là quan hệ nhân quả.`, R`Mũi tên chỉ mã hóa phụ thuộc có điều kiện; diễn giải nhân quả cần thêm giả định.`]],
  recap: [R`Phân phối chung = tích các $P(X_i\mid\text{cha})$.`, R`Suy luận: liệt kê → chuẩn hóa.`, R`Explaining away: một nguyên nhân được xác nhận làm nguyên nhân khác giảm.`],
  papers: ['Pearl (1988) — Probabilistic Reasoning in Intelligent Systems', 'Russell & Norvig — chương 13'] });

L({ id: 'hmm', p: 'psym', t: 'Suy luận theo thời gian: HMM & bộ lọc Kalman', en: 'HMM & Kalman Filter', min: 90, pre: ['bayesnet', 'gauss'],
  goals: ['Cập nhật niềm tin theo vòng dự đoán – hiệu chỉnh', 'Tính tay một bước lọc Kalman 1D', 'Biết ứng dụng trong theo dõi và dự báo'],
  intuit: R`<p>Bạn lái xe trong đường hầm, mất GPS. Bạn vẫn <b>dự đoán</b> vị trí từ tốc độ (càng đi lâu càng kém chắc chắn). Ra khỏi hầm, GPS báo một vị trí hơi lệch. Bạn <b>không tin hoàn toàn</b> cả hai: kết hợp dự đoán và đo đạc theo mức đáng tin của mỗi bên. Bộ lọc Kalman làm đúng việc này, hàng trăm lần mỗi giây, trong điện thoại, máy bay, robot.</p>`,
  body: R`
<h4>Mô hình trạng thái ẩn</h4>
<p>Trạng thái thật $x_t$ không thấy trực tiếp; chỉ thấy quan sát nhiễu $z_t$. Hai mô hình: <b>chuyển trạng thái</b> $P(x_t\mid x_{t-1})$ và <b>cảm biến</b> $P(z_t\mid x_t)$. Mỗi bước gồm:</p>
<ol><li><b>Dự đoán:</b> đẩy niềm tin qua mô hình chuyển động (niềm tin nở rộng ra).</li><li><b>Hiệu chỉnh:</b> nhân với likelihood của quan sát mới rồi chuẩn hóa (Bayes; niềm tin co lại).</li></ol>
<h4>HMM</h4>
<p>Trạng thái rời rạc (ví dụ máy: “bình thường / mòn / sắp hỏng”). Thuật toán forward cho xác suất trạng thái hiện tại; Viterbi cho chuỗi trạng thái khả dĩ nhất. Từng là nền tảng của nhận dạng giọng nói trước học sâu.</p>
<h4>Bộ lọc Kalman (1D)</h4>
<p>Trạng thái liên tục, mọi thứ Gaussian. Niềm tin $\mathcal N(\mu, P)$; nhiễu chuyển động $Q$; nhiễu đo $R$.</p>
$$\text{Dự đoán: } \mu^- = \mu + u,\quad P^- = P + Q$$
$$K = \frac{P^-}{P^- + R},\quad \mu = \mu^- + K(z - \mu^-),\quad P = (1-K)P^-$$
<p>$K$ (Kalman gain) từ 0 đến 1: đo đạc càng chính xác ($R$ nhỏ), càng tin quan sát.</p>`,
  w: 'kalman',
  worked: { t: 'Theo dõi vị trí băng tải bằng Kalman 1D',
    setup: R`Niềm tin hiện tại $\mu = 10$ cm, $P = 4$. Băng tải chạy $u = 5$ cm mỗi bước, nhiễu chuyển động $Q = 1$. Cảm biến đo $z = 16$ cm, nhiễu đo $R = 5$.`,
    steps: [
      R`<b>Dự đoán:</b> $\mu^- = 10 + 5 = 15$; $P^- = 4 + 1 = 5$.`,
      R`<b>Kalman gain:</b> $K = 5/(5+5) = 0.5$: tin dự đoán và cảm biến như nhau.`,
      R`<b>Hiệu chỉnh trung bình:</b> $\mu = 15 + 0.5\cdot(16 - 15) = 15.5$.`,
      R`<b>Hiệu chỉnh độ bất định:</b> $P = (1-0.5)\cdot5 = 2.5$. Nhỏ hơn cả $P^-$ (5) lẫn $R$ (5): kết hợp hai nguồn cho kết quả chắc chắn hơn từng nguồn riêng.`,
      R`<b>Nếu cảm biến tốt hơn ($R = 1$):</b> $K = 5/6 = 0.833$; $\mu = 15 + 0.833 = 15.83$; $P = 0.833$. Kết quả gần số đo hơn.`,
    ],
    ans: R`$\mu = 15.5$, $P = 2.5$ (với $R=5$).` },
  ex: [
    { q: R`HMM 2 trạng thái máy: Tốt (T), Mòn (M). Chuyển: T→T 0.9, T→M 0.1, M→M 1. Cảm biến rung “cao” với xác suất 0.1 nếu T, 0.7 nếu M. Niềm tin ban đầu $[0.95, 0.05]$. Đo được “cao”. Niềm tin mới?`, s: [R`Dự đoán: $P(T) = 0.95\cdot0.9 = 0.855$; $P(M) = 0.95\cdot0.1 + 0.05 = 0.145$.`, R`Nhân likelihood: T $0.855\cdot0.1 = 0.0855$; M $0.145\cdot0.7 = 0.1015$.`, R`Chuẩn hóa: tổng 0.187; T $= 0.457$, M $= 0.543$.`], a: R`$P(\text{Mòn}) \approx 54\%$: một lần rung cao đã đủ để nghi ngờ mạnh.` },
  ],
  miss: [[R`Kalman chỉ lấy trung bình dự đoán và đo đạc.`, R`Đó là trung bình <b>có trọng số theo độ tin cậy</b>, và nó cập nhật cả độ bất định.`]],
  recap: [R`Dự đoán (nở rộng) → hiệu chỉnh (co lại).`, R`HMM: trạng thái rời rạc; Kalman: Gaussian liên tục.`, R`$K = P^-/(P^- + R)$.`],
  papers: ['Kalman (1960) — A New Approach to Linear Filtering and Prediction Problems', 'Rabiner (1989) — A Tutorial on Hidden Markov Models'] });

L({ id: 'evo', p: 'psym', t: 'Giải thuật di truyền & tối ưu bầy đàn', en: 'Evolutionary Algorithms', min: 75, pre: ['aitypes', 'prob'],
  goals: ['Chạy tay một thế hệ GA: chọn lọc, lai ghép, đột biến', 'Hiểu PSO', 'Biết khi nào dùng tiến hóa thay vì gradient'],
  intuit: R`<p>Chọn giống lúa: gieo nhiều giống, giữ lại cây cho năng suất cao nhất, cho chúng <b>lai</b> với nhau, thỉnh thoảng có <b>đột biến</b> ngẫu nhiên. Qua nhiều mùa, giống lúa tốt dần mà không ai cần hiểu “đạo hàm năng suất theo gen”. Giải thuật di truyền dùng ý tưởng này cho bài toán mà gradient không có hoặc vô dụng: xếp lịch, thiết kế, chọn siêu tham số.</p>`,
  body: R`
<h4>Giải thuật di truyền (GA)</h4>
<ol><li><b>Mã hóa</b> lời giải thành “nhiễm sắc thể” (chuỗi bit, hoán vị, vector số).</li>
<li><b>Khởi tạo</b> quần thể ngẫu nhiên; tính <b>độ thích nghi</b> (fitness) từng cá thể.</li>
<li><b>Chọn lọc:</b> cá thể tốt có xác suất làm cha mẹ cao hơn (bánh xe roulette, đấu loại).</li>
<li><b>Lai ghép:</b> cắt hai cha mẹ tại một điểm, ghép nửa này với nửa kia.</li>
<li><b>Đột biến:</b> lật ngẫu nhiên vài bit với xác suất nhỏ (giữ đa dạng).</li>
<li>Lặp qua nhiều thế hệ; có thể giữ lại cá thể tốt nhất (elitism).</li></ol>
<h4>Tối ưu bầy đàn (PSO)</h4>
<p>Mỗi “con chim” có vị trí và vận tốc, bị kéo về vị trí tốt nhất <i>của nó</i> và tốt nhất <i>của cả đàn</i>:</p>
$$\mathbf v \leftarrow \omega\mathbf v + c_1r_1(\mathbf p_{best} - \mathbf x) + c_2r_2(\mathbf g_{best} - \mathbf x),\quad \mathbf x\leftarrow\mathbf x + \mathbf v$$
<h4>Khi nào dùng</h4>
<p>Không gian rời rạc hoặc không khả vi, nhiều cực trị cục bộ, hàm mục tiêu là hộp đen (mô phỏng). Ví dụ: lập lịch job-shop, cân bằng chuyền, thiết kế anten, tìm kiếm kiến trúc mạng (NAS). Nhược điểm: tốn nhiều lần đánh giá, không đảm bảo tối ưu.</p>`,
  w: 'ga',
  worked: { t: 'Một thế hệ GA tối đa hóa số bit 1',
    setup: R`Chuỗi 6 bit, fitness = số bit 1. Quần thể: A = 110100 (3), B = 011110 (4), C = 100001 (2), D = 001000 (1).`,
    steps: [
      R`<b>Xác suất chọn (roulette):</b> tổng fitness $= 10$. A 0.3, B 0.4, C 0.2, D 0.1.`,
      R`<b>Giả sử bốc được cặp (B, A)</b> và (B, C). Cá thể yếu D không được chọn.`,
      R`<b>Lai ghép (B, A) tại điểm 3:</b> B = 011|110, A = 110|100 → con1 = 011100 (3), con2 = 110110 (4).`,
      R`<b>Lai ghép (B, C) tại điểm 2:</b> B = 01|1110, C = 10|0001 → con3 = 01 + 0001 = 010001 (2), con4 = 10 + 1110 = 101110 (4).`,
      R`<b>Đột biến</b> (xác suất nhỏ): giả sử bit cuối của con2 lật: 110110 → 110111 (5).`,
      R`<b>Thế hệ mới:</b> 011100 (3), 110111 (5), 010001 (2), 101110 (4). Fitness trung bình tăng từ 2.5 lên 3.5; tốt nhất tăng từ 4 lên 5.`,
    ],
    ans: R`Trung bình 2.5 → 3.5; cá thể tốt nhất 110111 (5 bit 1).` },
  ex: [
    { q: R`PSO 1D: $x = 2$, $v = 0$, $p_{best} = 3$, $g_{best} = 5$, $\omega = 0.5$, $c_1 = c_2 = 1$, $r_1 = 0.5$, $r_2 = 0.4$. Tính $v$ và $x$ mới.`, s: [R`$v = 0.5\cdot0 + 1\cdot0.5\cdot(3-2) + 1\cdot0.4\cdot(5-2)$.`, R`$= 0 + 0.5 + 1.2 = 1.7$.`, R`$x = 2 + 1.7 = 3.7$.`], a: R`$v = 1.7$, $x = 3.7$: tiến về phía các vị trí tốt.` },
  ],
  miss: [[R`Tiến hóa luôn tốt hơn gradient vì tránh được cực trị cục bộ.`, R`Khi có gradient (như huấn luyện mạng nơ-ron), gradient descent hiệu quả hơn rất nhiều. Tiến hóa dành cho bài toán không có gradient hữu ích.`]],
  recap: [R`GA: chọn lọc → lai ghép → đột biến, lặp qua thế hệ.`, R`PSO: bị kéo về tốt nhất cá nhân và cả đàn.`, R`Dùng cho tối ưu rời rạc, hộp đen.`],
  papers: ['Holland (1975) — Adaptation in Natural and Artificial Systems', 'Kennedy & Eberhart (1995) — Particle Swarm Optimization'] });
